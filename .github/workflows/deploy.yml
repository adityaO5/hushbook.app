name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate _redirects, _headers and src/locale-rules.json
        run: node scripts/build-cloudflare-config.js

      # seo-preservation and seo-repair-contract are left out: they fail on a stale baseline.
      - name: Test
        run: |
          node localization.test.js
          node seo-localization.test.js
          node tracking-params.test.js
          node mobile-nav.test.js
          node blur-in-heading-reveal.test.js
          node alternative-pages.test.js
          node blog-pages.test.js
          node worker.test.js

      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy skipped
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy from CI."

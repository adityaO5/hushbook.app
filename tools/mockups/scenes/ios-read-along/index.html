<!doctype html>
<html lang="en" data-resolution="landscape-4k">

    <meta charset="UTF-8" />

    <style>
      /* RTL: English book content keeps its own direction */
      [dir="rtl"] .pbox { direction: ltr; text-align: left; }

      /* HushBook iPhone read-along, Lamplight + Folio (D:\hushbook lib/features/player). 393 x 852 pt stage. */
      @font-face{font-family:HBNews;src:url('../../assets/fonts/Newsreader-Variable.ttf');font-weight:200 800}
      @font-face{font-family:HBKameron;src:url('../../assets/fonts/Kameron-Variable.ttf');font-weight:400 700}
      @font-face{font-family:HBAtk;src:url('../../assets/fonts/AtkinsonHyperlegible-Regular.ttf');font-weight:400}
      @font-face{font-family:HBAtk;src:url('../../assets/fonts/AtkinsonHyperlegible-Bold.ttf');font-weight:700}
      @font-face{font-family:HBInter;src:url('../../assets/fonts/Inter-SemiBold.ttf');font-weight:600}

      *{box-sizing:border-box;margin:0;padding:0}
      html,body{margin:0;width:3840px;height:2160px;overflow:hidden;background:#FAF9F5}
      #root{position:relative;width:3840px;height:2160px;background:#FAF9F5}
      #app{position:absolute;inset:0;overflow:hidden}
      svg{display:block}
      #frame{position:absolute;pointer-events:none;z-index:2}
      /* The frame's transparent screen rect has square corners that reach past the device outline:
         clip the stage to a 400-unit radius (89.13 px at this size), as ios-offload does. */
      #screen{position:absolute;z-index:1;overflow:hidden}

      .stage{position:relative;width:393px;height:852px;overflow:hidden;background:var(--paper);color:var(--ink);
             font-family:HBAtk,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.25px;font-optical-sizing:none}

      /* Reader: page mode, text box 28 / 107 / 28 / 50 with the lamp's notch (synced_lyrics_view.dart). */
      #reader{position:absolute;inset:0;overflow:hidden}
      #pager{position:absolute;left:0;top:0;width:393px;height:852px}
      .page{position:absolute;top:0;width:393px;height:852px}
      .pbox{position:absolute;left:28px;top:107px;width:337px}
      .blk{padding:4px 0 28px;text-align:center}
      .blkLabel{font-family:HBNews,serif;font-variation-settings:"opsz" 18,"wght" 500;font-size:12px;letter-spacing:1.44px;line-height:15px;
                font-feature-settings:"case","kern";color:var(--rubricText);white-space:nowrap}
      .rule{width:36px;height:1px;margin:16px auto 0;background:var(--hairline)}
      .narrowCol{width:265px}
      .ln{font-family:var(--lfont);font-size:23px;line-height:34.5px;font-variation-settings:var(--lvar);white-space:normal;font-kerning:normal;color:var(--far)}
      .tx{position:relative}
      .cap{font-size:49.45px;color:var(--rubric) !important;font-variation-settings:var(--capvar)}
      .w{position:relative}
      .w.sp,.wipe{color:var(--spoken)}
      .wipe{position:absolute;left:0;top:0;white-space:nowrap;line-height:normal}
      .w.now::after{content:"";position:absolute;left:0;right:0;top:100%;height:2px;background:var(--rubric);opacity:var(--nowA,1)}
      .off{visibility:hidden}
      #pnum{position:absolute;left:28px;width:265px;top:802px;text-align:center;font-family:HBNews,serif;font-variation-settings:"opsz" 18,"wght" 400;
            font-size:14px;line-height:1.3;font-variant-numeric:lining-nums tabular-nums;color:var(--secondary);white-space:nowrap}
      #meas{position:absolute;left:0;top:0;visibility:hidden}

      /* Running head (chrome/running_head.dart): 48 tall under the status bar. */
      #head{position:absolute;left:0;top:59px;width:393px;height:48px;color:var(--ink)}
      .hb{position:absolute;top:0;width:48px;height:48px;display:grid;place-items:center}
      #hBack{left:4px}
      #hBack span{padding:0 0 6px 9px;font-family:HBNews,serif;font-size:36px;line-height:1;font-variation-settings:"opsz" 18,"wght" 380;letter-spacing:.25px}
      #hTitle{position:absolute;left:100px;width:193px;top:0;height:48px;display:grid;place-items:center;text-align:center;white-space:nowrap;
              font-family:HBNews,serif;font-size:11px;letter-spacing:.935px;line-height:1.3;font-feature-settings:"case","kern";
              font-variation-settings:"opsz" 18,"wght" 500;color:var(--secondary)}
      #hTitle b{font-weight:normal;font-variation-settings:"opsz" 18,"wght" 700;color:var(--rubric)}
      #hAa{left:293px}
      #hAa span{font-family:HBNews,serif;font-size:19px;letter-spacing:-.19px;line-height:1.43;font-variation-settings:"opsz" 18,"wght" 450}
      #hMark{left:341px}

      /* Dock (chrome/dock_card.dart + controls/playback_controls.dart, dock density). */
      #dockBox{position:absolute;background:var(--dock);border:1px solid var(--dockHairline);box-shadow:var(--dockShadow)}
      #dock{position:absolute;padding:14px 16px}
      #scrub{position:relative;height:64.1px}
      #track{position:absolute;left:0;right:0;top:0;height:48px}
      #tIn{position:absolute;top:21px;height:6px;border-radius:0 3px 3px 0;background:var(--track)}
      #tAc{position:absolute;left:0;top:20px;height:8px;border-radius:4px 0 0 4px;background:var(--rubric)}
      #thumb{position:absolute;top:12px;width:24px;height:24px;border-radius:50%;background:var(--ink);box-shadow:0 .5px 1.5px rgba(0,0,0,.3)}
      #times{position:absolute;left:0;right:0;top:44px;display:flex;align-items:center}
      .time{font-weight:700;font-size:15px;line-height:1.34;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
      #chapLine{flex:1;margin:0 12px;text-align:center;font-size:15px;line-height:1.34;color:var(--secondary);white-space:nowrap}
      #transport{margin-top:4px;height:64px;display:flex;align-items:center;justify-content:space-between}
      .tb{display:grid;place-items:center;flex:none;color:var(--ink)}
      .tb.sec{color:var(--secondary)}
      .tb.dis{color:var(--disabled)}
      #disc{width:64px;height:64px;border-radius:50%;background:var(--rubric);color:var(--glyph)}
      #pills{margin-top:10px;height:48px;display:flex}
      .pill{height:48px;border-radius:28px;background:var(--button);display:flex;align-items:center;justify-content:center;padding:6px 10px;min-width:48px}
      .pill svg{color:var(--secondary);flex:none;margin-right:5px}
      .pill span{font-weight:700;font-size:15px;line-height:1.25;color:var(--ink);white-space:nowrap}
      .pgap{width:6px;flex:none}
      #more{width:48px;flex:none;padding:0;color:var(--ink)}
      #more svg{color:var(--ink);margin:0}

      /* Lamp and its handle (chrome/lamp.dart) while reading. */
      #lamp{position:absolute;left:309px;top:738px;width:64px;height:64px}
      #lampDisc{position:absolute;inset:0;border-radius:50%;background:var(--dock);border:1px solid var(--dockHairline);box-shadow:var(--dockShadow)}
      #lampRings{position:absolute;left:-1px;top:-1px}
      #lampCore{position:absolute;left:11px;top:11px;width:42px;height:42px;border-radius:50%;background:var(--rubric);color:var(--glyph);display:grid;place-items:center}
      #handle{position:absolute;left:321px;top:708px;width:40px;height:26px;border-radius:13px;background:var(--dock);border:1px solid var(--dockHairline);
              box-shadow:0 4px 14.9px rgba(0,0,0,.14);display:grid;place-items:center;color:var(--secondary)}

      /* iOS chrome drawn over the app. */
      #sbar{position:absolute;left:0;top:0;width:393px;height:54px;color:var(--sb)}
      #sbTime{position:absolute;left:24px;width:80px;top:19px;text-align:center;font-family:HBInter,sans-serif;font-size:17px;font-weight:600;letter-spacing:-.2px;line-height:22px}
      #sbIcons{position:absolute;left:293px;top:23px}
      #home{position:absolute;left:129.5px;bottom:8px;width:134px;height:5px;border-radius:2.5px;background:var(--sb)}

    <script>
      // ── Shot variables (render.mjs sets them from shots.json "vars") ─────────────
      //   theme  the reading look: 'ambient' (default; the ink-black page with the cover's wash),
      //          'sepia', 'dark', 'amber', or 'warm' (the Warm Paper preset: sepia + Kameron +
      //          its brown spoken accent).
      //   font   the reading face: 'news' (Newsreader) or 'kameron'. Defaults to the look's own
      //          face: Newsreader, except Kameron for 'warm'.
      // Film time t is the chapter position in seconds (START = 0). The dock shows until 2.5 s
      // and folds into the lamp by about 3 s; shots without the dock need t >= 3.

      // ── The excerpt: The Hitch-Hiker's Guide to the Galaxy, chapter 1 (BUILDER-BRIEF.md) ──
      const CHAPTER = [
"Far out in the uncharted backwaters of the unfashionable end of the western spiral arm of the Galaxy lies a small unregarded yellow sun.",

          let cur = -1, frac = 0;
          if (active && newest >= 0 && pos < wEnd[idx[newest]]) { cur = newest; frac = (pos - wStart[idx[newest]]) / (wEnd[idx[newest]] - wStart[idx[newest]]); }
          idx.forEach((i, k) => {
            const s = spans[i];
            let wp = s.querySelector('.wipe');
            const spoken = active && k <= newest && k !== cur;
            const now = active && k === newest;
            s.className = 'w' + (spoken ? ' sp' : '') + (now ? ' now' : '');
            if (now) s.style.setProperty('--nowA', act.toFixed(3)); else s.style.removeProperty('--nowA');
            if (active && k === cur) {
              if (!wp) { wp = document.createElement('span'); wp.className = 'wipe'; wp.innerHTML = wordHTML(i, L.flat[n].cap && k === 0); s.appendChild(wp); }
              wp.style.clipPath = 'inset(-4px ' + ((1 - frac) * 100).toFixed(3) + '% -4px 0)';
            } else if (wp) wp.remove();
          });
        }
      }

      // ── Everything visible is a function of film time t ─────────────────────────
      const clock = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };
      // The shot's look, set once at build time (the colours; the pages are built for LOOK.font).
      function applyLook(look) {
        tk = tokens(look);
        for (const k of ['page', 'paper', 'ink', 'secondary', 'rubric', 'rubricText', 'near', 'far', 'spoken', 'glyph', 'dock', 'dockHairline', 'button', 'track', 'hairline', 'disabled', 'dockShadow', 'sb'])
          stage.style.setProperty('--' + k, tk[k]);
        $('ringTrack').setAttribute('stroke', tk.track);
        $('ringArc').setAttribute('stroke', tk.rubric);
      }
      function show(el, opacity) {
        el.style.opacity = opacity;
        el.style.visibility = opacity <= 0.001 ? 'hidden' : 'visible';
      }
      const lerp = (a, b, p) => a + (b - a) * p;
      let CARD = null;

      function render(t) {
        const pos = START + t;
        const lookSince = 0, L = LAYOUT[LOOK.font];

        // Active line: sticky binary search over the paged lines.
        let lo = 0, hi = L.flat.length - 1;
        while (lo < hi) { const m = (lo + hi + 1) >> 1; if (L.flat[m].start <= pos) lo = m; else hi = m - 1; }
        const li = L.flat[lo].start <= pos ? lo : -1;

        // Page follow: animateToPage 320 ms easeOutCubic.
        const page = li >= 0 ? L.flat[li].page : 0;
        let off = page;
        if (page > 0) {
          const tc = L.flat[L.firstOfPage[page]].start - START;
          if (tc >= lookSince && t - tc < 0.32) off = page - 1 + easeOutCubic((t - tc) / 0.32);
        }
        pager.style.transform = 'translateX(' + (-off * 393).toFixed(3) + 'px)';
        $('pnum').textContent = (Math.round(off) + 1) + ' / ' + L.pages.length;

        paintKaraoke(L, li, pos, START + lookSince);

        // Dock -> lamp (DockUnfold 300 ms easeInOut; contents fade by 60%); the lamp fades in
        // after 200 ms and grows from .8, its handle after 260 ms; the page's dock fade lets go.
        const tau = t - T_HIDE;
        const u = tau <= 0 ? 1 : Math.max(0, 1 - tau / 0.3), e = easeInOut(u);
        const box = $('dockBox');
        if (u > 0) {
          const x = lerp(LAMP.x, CARD.x, e), y = lerp(LAMP.y, CARD.y, e), w = lerp(LAMP.s, CARD.w, e), h = lerp(LAMP.s, CARD.h, e);
          box.style.left = x + 'px'; box.style.top = y + 'px'; box.style.width = w + 'px'; box.style.height = h + 'px';
          box.style.borderRadius = lerp(32, 28, e) + 'px';
          show(box, 1);
        } else show(box, 0);
        show($('dock'), Math.max(0, Math.min(1, (u - 0.6) / 0.4)));
        const lampA = tau <= 0 ? 0 : ease((tau - 0.2) / 0.2);
        const lampS = tau <= 0 ? 0.8 : lerp(0.8, 1, kOut((tau - 0.18) / 0.26));
        show($('lamp'), lampA); $('lamp').style.transform = 'scale(' + lampS.toFixed(4) + ')';
        show($('handle'), tau <= 0 ? 0 : ease((tau - 0.26) / 0.2));
        // ReaderDockFade: a 48 px fade ending 14 px above the dock while it shows, released over 300 ms.
        const s = tau <= 0 ? 1 : 1 - easeOut(tau / 0.3);
        const end = CARD.y - 14, start = end - 48;
        if (s > 0) {
          const a = (1 - s).toFixed(4);
          pager.style.webkitMaskImage = pager.style.maskImage = 'linear-gradient(to bottom,#000 0,#000 ' + start + 'px,rgba(0,0,0,' + a + ') ' + end + 'px,rgba(0,0,0,' + a + ') 100%)';
        } else pager.style.webkitMaskImage = pager.style.maskImage = 'none';
        // Not drawn: pages off screen, and lines wholly inside the closed part of the fade.
        for (const ln of lineList) {
          const offPage = Math.abs(ln.page - off) >= 0.999;
          const masked = s >= 0.999 && ln.top + LINE_PAD >= end;
          ln.el.classList.toggle('off', offPage || masked);
        }
        show($('pnum'), u > 0 ? 0 : 1);

        // Scrubber, times and the lamp's chapter ring.
        const frac = pos / CHAPTER_LEN;
        $('elapsed').textContent = clock(pos);
        $('remaining').textContent = '−' + clock(CHAPTER_LEN - pos);
        const tw = $('track').offsetWidth, cx = tw * frac;
        $('tAc').style.width = cx + 'px';
        $('tIn').style.left = cx + 'px'; $('tIn').style.width = (tw - cx) + 'px';
        $('thumb').style.left = (cx - 12) + 'px';
        const sweep = 2 * Math.PI * Math.min(1, frac), ex = 33 + 30 * Math.sin(sweep), ey = 33 - 30 * Math.cos(sweep);
        $('ringArc').setAttribute('d', 'M33 3A30 30 0 ' + (sweep > Math.PI ? 1 : 0) + ' 1 ' + ex.toFixed(3) + ' ' + ey.toFixed(3));
      }

      // ── Static pieces ────────────────────────────────────────────────────────────
      function statusIcons() {
        let d = '';
        [[0, 7], [4.6, 5], [9.2, 2.6], [13.8, 0]].forEach(([x, y]) => { d += '<rect x="' + x + '" y="' + (1 + y) + '" width="3.2" height="' + (11 - y) + '" rx="1"/>'; });
        const cx = 30.65, cy = 11.6, a = Math.PI / 4;
        const pt = (r, s) => (cx + r * Math.sin(s * a)).toFixed(2) + ' ' + (cy - r * Math.cos(s * a)).toFixed(2);
        const sector = (r0, r1) => r0 === 0
          ? 'M' + cx + ' ' + cy + 'L' + pt(r1, -1) + 'A' + r1 + ' ' + r1 + ' 0 0 1 ' + pt(r1, 1) + 'Z'
          : 'M' + pt(r0, -1) + 'L' + pt(r1, -1) + 'A' + r1 + ' ' + r1 + ' 0 0 1 ' + pt(r1, 1) + 'L' + pt(r0, 1) + 'A' + r0 + ' ' + r0 + ' 0 0 0 ' + pt(r0, -1) + 'Z';
        d += '<path d="' + sector(0, 3.3) + sector(5.0, 7.0) + sector(8.7, 10.8) + '"/>';
        d += '<rect x="45.5" y=".5" width="25" height="12" rx="3.8" fill="none" stroke="currentColor" stroke-opacity=".35"/>';
        d += '<rect x="47.5" y="2.5" width="21" height="8" rx="2"/>';
        d += '<path d="M72 4.5c.9.3 1.5 1.1 1.5 2s-.6 1.7-1.5 2Z" fill-opacity=".4"/>';
        $('sbG').innerHTML = d;
      }
      function placeDevice() {
        // frame-iphone.png 4317 x 8796, screen x 199..4111, y 168..8653; 1960 px tall, centred.
        const s = 1960 / 8796, fw = 4317 * s, fl = (3840 - fw) / 2, ft = (2160 - 1960) / 2;
        const fr = $('frame');
        fr.style.left = fl + 'px'; fr.style.top = ft + 'px'; fr.style.width = fw + 'px'; fr.style.height = '1960px';
        const sw = 3913 * s, sh = 8486 * s, z = Math.max(sw / 393, sh / 852);
        const sc = $('screen');
        sc.style.left = (fl + 199 * s) + 'px';
        sc.style.top = (ft + 168 * s) + 'px';
        sc.style.width = sw + 'px'; sc.style.height = sh + 'px';
        sc.style.borderRadius = (400 * s) + 'px';
        stage.style.marginLeft = ((sw - 393 * z) / 2 / z) + 'px';
        stage.style.zoom = z;
      }
      function layoutDock() {
        // DockCard: 12 dp gutters, 8 dp above the home-indicator inset, contents 14 / 16 padding.
        const dock = $('dock');
        dock.style.left = '12px'; dock.style.width = (393 - 24) + 'px';
        // Pills: one row with icons (fitPills), each as wide as its natural width allows (flex x10).
        const pills = ['pSpeed', 'pSleep', 'pChapters'].map($);
        const textW = pills.map(p => Math.ceil(p.querySelector('span').getBoundingClientRect().width / zoomZ));
        pills.forEach((p, k) => { p.style.flex = Math.max(1, Math.round((10 * 2 + textW[k] + 18 + 5) * 10)) + ' 1 0'; });
        const h = dock.offsetHeight;
        const bottom = 852 - SAFE_BOTTOM - 8;
        dock.style.top = (bottom - h) + 'px';
        CARD = { x: 12, y: bottom - h, w: 393 - 24, h };
      }

      placeDevice();
      // Every face the film measures with, loaded before measuring (fonts.ready only covers faces in use).
      const FACES = ['400 23px HBNews', '400 23px HBKameron', '400 15px HBAtk', '700 15px HBAtk', '600 17px HBInter'];
      document.fonts.ready.then(() => Promise.all(FACES.map(f => document.fonts.load(f)))).then(() => {
        // Translated strings first: everything below measures them.
        hbLocaleSetup();
        hbApplyStrings();
        const head = chapterLabelParts();
        $('hTitleText').innerHTML = esc(head[0]) + (head[1] ? '<b>' + esc(head[1]) + '</b>' : '') + esc(head[2]);
        $('chapLine').textContent = hbT('chapterNumber', 'Chapter {number}').replace('{number}', String(CHAPTER_NUMBER));
        zoomZ = stage.getBoundingClientRect().width / 393;
        statusIcons();
        applyLook(LOOK);
        layoutDock();
        // Paginate the shot's reading font.
        meas = document.createElement('div');
        meas.id = 'meas'; meas.className = 'ln';
        $('reader').appendChild(meas);
        for (const fontId of [LOOK.font]) {
          const F = FONTS[fontId];
          meas.style.fontFamily = F.family;
          meas.style.fontVariationSettings = F.lvar;
          // Flutter splits a line's leading by ascent/descent; CSS halves it. Shift the glyphs to match.
          shift[fontId] = LINE_H * F.A / (F.A + F.D) - ((LINE_H - (F.A + F.D) * FONT_PX) / 2 + F.A * FONT_PX);
          // Drop cap: 2.15 x the size, w450, height .78, so its row is 0.78 x 49.45 tall.
          const capRule = document.createElement('style');
          capRule.textContent = '#meas .cap{line-height:28px;font-variation-settings:' + F.capvar + '}';
          document.head.appendChild(capRule);
          meas.style.width = PAGE_W + 'px';
          // Measured on the chapter's own first letters (the cap and the one after it).
          const first = words[0].text, capCh = String.fromCodePoint(first.codePointAt(0)), rest = first.slice(capCh.length, capCh.length + 1);
          meas.innerHTML = '<div class="tx"><span class="cap">' + esc(capCh) + '</span>' + esc(rest) + '</div>';
          const h0 = meas.getBoundingClientRect().height / zoomZ;
          capLH[fontId] = 28 + 2 * (CAP_ROW - h0);
          capRule.textContent = '#meas .cap{line-height:' + capLH[fontId] + 'px;font-variation-settings:' + F.capvar + '}';
          LAYOUT[fontId] = paginate();
          capRule.remove();
        }
        meas.remove();
        buildPages(LOOK.font);
        window.__dbg = () => ({
          zoom: zoomZ, capLH, shift, pageH: PAGE_H, notchTop: NOTCH_TOP, notchW: NOTCH_W, card: CARD, near: tk.nearA, far: tk.farA,
          layouts: Object.fromEntries(Object.entries(LAYOUT).map(([k, L]) => [k, { pages: L.pages.length,
            flat: L.flat.map(f => ({ a: f.idx[0], b: f.idx[f.idx.length - 1], page: f.page, start: +f.start.toFixed(2), narrow: f.narrow, ja: f.joinAbove, jb: f.joinBelow })) }])),
          tops: lineList.map(l => [+l.el.dataset.l, l.page, +(l.top).toFixed(1), +(l.top + l.el.getBoundingClientRect().height / zoomZ).toFixed(1)]),
        });
        render(0);

        const tl = gsap.timeline({ paused: true });
        const clockProxy = { t: 0 };
        tl.to(clockProxy, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => render(clockProxy.t) }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
        window.__hbReady = true;
      });
    </script>
  </body>

<!doctype html>
<html lang="en" data-resolution="landscape-4k">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="../../lib/i18n.js"></script>
    <style>
      /* HushBook iPhone app, Library tab, light theme, grid view. A still: no showcase scene exists, so it is
         built from D:\hushbook\lib\features\library (library_screen.dart, widgets\library_chips_header.dart,
         widgets\library_grid_cell.dart, widgets\book_row.dart LibraryBookCover, widgets\library_tokens.dart)
         and the shell's NavDock (home\dock\nav_pill_row.dart), on the device, status bar and dock code of
         scenes/ios-home. LibraryTokens.light, HbColors.light (lib/theme/hb_colors.dart). */
      :root {
        --page: #FBF8F2; --card: #F3EDE3; --accent: #6F3825; --onAccent: #FFFFFF; --secondaryInk: #6B5E52;
        --textPrimary: #090A0A; --textBody: #2F2F2F;
        --dockLabel: #3A3734;
        --canvas: #FAF9F5;
      }
      @font-face { font-family: HBInter; src: url('../../assets/fonts/Inter-Regular.ttf'); font-weight: 400; }
      @font-face { font-family: HBInter; src: url('../../assets/fonts/Inter-Medium.ttf'); font-weight: 500; }
      @font-face { font-family: HBInter; src: url('../../assets/fonts/Inter-SemiBold.ttf'); font-weight: 600; }
      @font-face { font-family: HBInter; src: url('../../assets/fonts/Inter-Bold.ttf'); font-weight: 700; }
      @font-face { font-family: HBMaterial; src: url('../../assets/fonts/MaterialIcons-Regular.otf'); font-weight: 400; }
      @font-face { font-family: HBCupertino; src: url('../../assets/fonts/CupertinoIcons.ttf'); font-weight: 400; }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { margin: 0; width: 3840px; height: 2160px; overflow: hidden; background: var(--canvas); }
      #root { width: 100%; height: 100%; position: relative; background: var(--canvas); }
      #film { position: absolute; inset: 0; }
      img { display: block; }

      /* ── Device: frame-iphone.png over the 393 x 852 stage (positions computed in build()) ── */
      #phone { position: absolute; }
      #frame { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 2; }
      #screenHost { position: absolute; z-index: 1; }
      #stageWrap { position: absolute; }
      .stage { position: absolute; left: 0; top: 0; width: 393px; height: 852px; overflow: hidden; background: var(--page);
               font-family: HBInter, sans-serif; color: var(--textBody); -webkit-font-smoothing: antialiased; }

      /* Icon fonts: Flutter Icon(size) = the glyph at fontSize = size in a size x size box. */
      .mi, .ci { display: inline-block; flex: none; text-align: center; font-style: normal; font-weight: 400; white-space: nowrap; }
      .mi { font-family: HBMaterial; }
      .ci { font-family: HBCupertino; }
      .s20 { font-size: 20px; line-height: 20px; width: 20px; height: 20px; }
      .s22 { font-size: 22px; line-height: 22px; width: 22px; height: 22px; }

      /* ── Status bar + home indicator (drawn by iOS) ── */
      #statusBar { position: absolute; left: 0; top: 0; width: 393px; height: 54px; z-index: 20; color: #000; }
      #sbTime { position: absolute; left: 0; width: 132px; top: 21px; text-align: center; font: 600 17px/20px HBInter; letter-spacing: -0.2px; }
      #sbIcons { position: absolute; right: 0; width: 132px; top: 21px; height: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; }
      #homeIndicator { position: absolute; left: 129.5px; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: #000; z-index: 20; }

      /* SafeArea(top, bottom: false): the list's viewport starts under the status bar and runs behind the dock. */
      #viewport { position: absolute; left: 0; top: 59px; width: 393px; height: 793px; overflow: hidden; }
      #content { position: absolute; left: 0; top: 0; width: 393px; }

      /* _YourBooksHeader: padding (16, 4, 8, 0), min 48; "Your books" Inter 700 19/1.25, the count 500 15/1.25, Select. */
      .ybHead { padding: 4px 8px 0 16px; }
      .ybRow { min-height: 48px; display: flex; align-items: center; }
      .ybLeft { flex: 1; min-width: 0; display: flex; align-items: center; }
      .ybTitle { font-weight: 700; font-size: 19px; color: var(--textPrimary); white-space: nowrap; min-width: 0; }
      .ybCount { margin-left: 8px; font-weight: 500; font-size: 15px; color: var(--secondaryInk); white-space: nowrap; }
      .textBtn { min-width: 48px; min-height: 48px; padding: 0 8px; display: flex; align-items: center; justify-content: center;
                 font-weight: 600; font-size: 15px; color: var(--accent); white-space: nowrap; }

      /* LibraryChipsHeader (pinned; at rest in this frame): the chip row, 2, the sort line; rows 48. */
      .chips { height: 48px; padding: 0 16px; display: flex; align-items: center; white-space: nowrap; }
      .chip { flex: none; height: 38px; padding: 0 16px; margin-left: 8px; border-radius: 19px; background: var(--card);
              display: flex; align-items: center; font-weight: 600; font-size: 14px; color: var(--textBody); }
      .chip:first-child { margin-left: 0; }
      .chip.on { background: var(--accent); color: var(--onAccent); }
      .sortRow { margin-top: 2px; height: 48px; display: flex; align-items: center; }
      .sortLine { flex: 1; min-width: 0; height: 48px; display: flex; align-items: center; }
      .sortIn { padding: 0 16px; display: flex; align-items: center; color: var(--textPrimary); min-width: 0; }
      .sortLabel { font-weight: 600; font-size: 14px; white-space: nowrap; }
      .sortIn .mi { margin-left: 2px; }
      .viewSwitch { width: 48px; height: 48px; flex: none; display: grid; place-items: center; color: var(--textPrimary); margin-right: 8px; }

      /* The grid: SliverPadding(16, 8, 16, 8), columns = ceil(width / 124), gaps 12 / 16,
         cell extent = width x 1.5 + 6 + 17 x 2 + 2 + 16 (library_grid_cell.dart). */
      .grid { padding: 8px 16px; display: grid; column-gap: 12px; row-gap: 16px; align-items: start; }
      .cell { display: flex; flex-direction: column; min-width: 0; }
      .cover { width: 100%; border-radius: 3px 7px 7px 3px; overflow: hidden; }
      .cover img { width: 100%; height: 100%; object-fit: cover; }
      .cTitle { margin-top: 6px; font-weight: 600; font-size: 13px; color: var(--textPrimary);
                display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
      .cLine { margin-top: 2px; font-weight: 400; font-size: 12px; color: var(--secondaryInk); white-space: nowrap; }

      /* NavDock (light, no player row: nothing loaded after a cold start), Library the current tab. */
      #dock { position: absolute; left: 16px; top: 770px; width: 361px; height: 64px; border-radius: 32px; overflow: hidden; z-index: 10;
              box-shadow: 0 12px 35.6px rgba(0,0,0,.15), 0 2px 7.9px rgba(0,0,0,.06);
              background: linear-gradient(to bottom, rgba(248,245,239,.95), rgba(248,245,239,.90));
              -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
      #dock .edge { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.70); border-radius: 32px; }
      #capsule { position: absolute; top: 6px; bottom: 6px; left: 93.25px; width: 87.25px; border-radius: 26px; background: rgba(111,56,37,.13); }
      .dockRow { position: absolute; inset: 6px; display: flex; }
      .tab { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dockLabel); }
      .tab.on { color: var(--accent); }
      .tab span { margin-top: 2px; font-weight: 500; font-size: 11px; line-height: 13.2px; }
      .tab.on span { font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="3840" data-height="2160" data-fps="60">
      <div id="film" class="clip" data-start="0" data-duration="1" data-track-index="0" data-track-kind="graphics" data-layout-allow-overflow>
        <div id="phone">
          <div id="screenHost">
            <div id="stageWrap">
              <div class="stage" id="stage" data-layout-allow-overflow>

                <!-- ═══ Library tab inside ShellScaffold ═══
                     The list is scrolled down to "Your books": above it, off screen, sit the title row
                     ("Library", Saved quotes & bookmarks, Import audiobook; 56), the search field (6 + 48) and
                     Continue (the two books in progress as cards, about 326). -->
                <div id="viewport" data-layout-allow-overflow>
                  <div id="content">
                    <div class="ybHead">
                      <div class="ybRow">
                        <div class="ybLeft">
                          <div class="ybTitle" data-fh="1.25" data-t="libraryYourBooks">Your books</div>
                          <div class="ybCount" id="ybCount" data-fh="1.25">17</div>
                        </div>
                        <div class="textBtn" data-t="librarySelect">Select</div>
                      </div>
                    </div>

                    <div class="chipsHeader">
                      <div class="chips">
                        <div class="chip on" data-fh="1.25" data-t="libraryChipAll">All</div>
                        <div class="chip" data-fh="1.25" data-t="libraryChipInProgress">In progress</div>
                        <div class="chip" data-fh="1.25" data-t="libraryChipNotStarted">Not started</div>
                        <div class="chip" data-fh="1.25" data-t="libraryChipFinished">Finished</div>
                      </div>
                      <div class="sortRow">
                        <div class="sortLine">
                          <div class="sortIn"><span class="sortLabel" data-fh="1.25" data-t="librarySortRecentlyPlayed">Recently played</span><i class="mi s20">&#xf720;</i></div>
                        </div>
                        <!-- In grid view the switch offers the list: Icons.view_list_rounded. -->
                        <div class="viewSwitch" data-t-attr="aria-label:libraryShowAsList" aria-label="Show as list"><i class="mi s22">&#xf028a;</i></div>
                      </div>
                    </div>

                    <div class="grid" id="grid"></div>
                  </div>
                </div>

                <div id="dock" data-layout-allow-occlusion data-layout-allow-overlap>
                  <div id="capsule"></div>
                  <div class="dockRow">
                    <div class="tab"><i class="ci s22">&#xf6ca;</i><span data-t="navHome">Home</span></div>
                    <div class="tab on"><i class="ci s22">&#xf3e8;</i><span data-t="navLibrary">Library</span></div>
                    <div class="tab"><i class="ci s22">&#xf8b7;</i><span data-t="navAnalytics">Analytics</span></div>
                    <div class="tab"><i class="ci s22">&#xf47e;</i><span data-t="navProfile">Profile</span></div>
                  </div>
                  <div class="edge"></div>
                </div>

                <div id="statusBar" data-layout-allow-occlusion>
                  <div id="sbTime">9:41</div>
                  <div id="sbIcons">
                    <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="7.5" width="3.2" height="4.5" rx="1" fill="#000" /><rect x="4.9" y="5.2" width="3.2" height="6.8" rx="1" fill="#000" /><rect x="9.8" y="2.8" width="3.2" height="9.2" rx="1" fill="#000" /><rect x="14.7" y="0" width="3.2" height="12" rx="1" fill="#000" /></svg>
                    <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5.2.2.5.2.7 0l1.2-1.2c.2-.2.2-.5 0-.7A11.6 11.6 0 0 0 8.5 0C5.4 0 2.4 1.2.3 3c-.2.2-.2.5 0 .7l1.2 1.2c.2.2.5.2.7 0a9.1 9.1 0 0 1 6.3-2.6Z" fill="#000" /><path d="M8.5 6c1.3 0 2.6.5 3.6 1.4.2.2.5.2.7 0L14 6.2c.2-.2.2-.5 0-.7a8.1 8.1 0 0 0-11 0c-.2.2-.2.5 0 .7l1.2 1.2c.2.2.5.2.7 0 1-.9 2.3-1.4 3.6-1.4Z" fill="#000" /><path d="M10.9 9.3c.2-.2.2-.5 0-.7a3.5 3.5 0 0 0-4.8 0c-.2.2-.2.5 0 .7l2 2c.2.2.5.2.7 0Z" fill="#000" /></svg>
                    <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.6" fill="none" stroke="#000" stroke-opacity=".38" /><rect x="2" y="2" width="20" height="9" rx="2.2" fill="#000" /><path d="M25 4.3v4.4c.9-.3 1.5-1.2 1.5-2.2s-.6-1.9-1.5-2.2Z" fill="#000" fill-opacity=".45" /></svg>
                  </div>
                </div>
                <div id="homeIndicator" data-layout-allow-occlusion></div>
              </div>
            </div>
          </div>
          <img id="frame" src="../../assets/frame-iphone.png" alt="" data-layout-allow-occlusion />
        </div>
      </div>
    </div>

    <script>
      // A still: no shot variables, render(t) draws nothing new. Every visible UI string goes through
      // data-t / hbT (strings/en.json); titles and numbers stay as they are.
      const DUR = 1;

      // ── Device geometry (showcase BRIEF: frame scale 0.2228, screen rect x 199..4111, y 168..8653) ──
      const FRAME = { w: 4317, h: 8796 }, SCREEN = { x: 199, y: 168, w: 3913, h: 8486 }, S = 0.2228;
      const STAGE_W = 393, STAGE_H = 852;

      // ── The library (17 books), in the list's order: sort Recently played (the default; it resets on a
      // cold start), chip All, no search. Started books by last play, then the rest by date added, the same
      // order Home's hero reads (Hitchhiker's, The Lord of the Rings, Mexican Gothic). Lengths are the
      // audiobooks' own, as Home carries them: started -> "{time} left" (left, minutes); not started -> the
      // book's length (len, minutes). Covers from row 3 on fall below the dock and the screen's edge, where
      // no line shows, so those books carry none.
      const BOOKS = [
        { cover: 'hitchhikers.jpg', title: 'The Hitch-Hiker’s Guide to the Galaxy', author: 'Douglas Adams', left: 232 },
        { cover: 'LOR.jpg', title: 'The Lord of the Rings', author: 'J.R.R. Tolkien', left: 1273 },
        { cover: 'Mexicangothic.jpg', title: 'Mexican Gothic', author: 'Silvia Moreno-Garcia', len: 632 },
        { cover: 'dune.jpg', title: 'Dune', author: 'Frank Herbert', len: 1262 },
        { cover: 'the martian.webp', title: 'The Martian', author: 'Andy Weir', len: 653 },
        { cover: 'trevor_noah.jpg', title: 'Born a Crime', author: 'Trevor Noah', len: 524 },
        { cover: 'projecthailmary.webp', title: 'Project Hail Mary', author: 'Andy Weir' },
        { cover: 'LH.jpg', title: 'The Love Hypothesis', author: 'Ali Hazelwood' },
        { cover: 'harry potter.jpg', title: 'Harry Potter and the Sorcerer’s Stone', author: 'J.K. Rowling' },
        { cover: 'odessey.jpg', title: 'The Odyssey', author: 'Homer' },
        { cover: 'crimeandpunishmentjpg.jpg', title: 'Crime and Punishment', author: 'Fyodor Dostoevsky' },
        { cover: 'fantastic beasts.jpg', title: 'Fantastic Beasts and Where to Find Them', author: 'J.K. Rowling' },
        { cover: 'prideandprejudice.jpg', title: 'Pride and Prejudice', author: 'Jane Austen' },
        { cover: 'alexandardumas.jpg', title: 'The Count of Monte Cristo', author: 'Alexandre Dumas' },
        { cover: 'harry potter1.jpg', title: 'Harry Potter and the Prisoner of Azkaban', author: 'J.K. Rowling' },
        { cover: 'dungeon crawler carl.jpg', title: 'Dungeon Crawler Carl', author: 'Matt Dinniman' },
        { cover: 'fourthwing.jpg', title: 'Fourth Wing', author: 'Rebecca Yarros' },
      ];

      // Strings with a value in them: the template from strings/<locale>.json, {name} filled in.
      const fmt = (key, english, args) => hbT(key, english).replace(/\{(\w+)\}/g, (m, k) => (k in args ? args[k] : m));
      // formatListenDuration: "4h 20m" or "37m"; formatTimeLeft: "{duration} left".
      const durationText = min => min >= 60
        ? fmt('durationHoursMinutes', '{hours}h {minutes}m', { hours: Math.floor(min / 60), minutes: min % 60 })
        : fmt('durationMinutes', '{minutes}m', { minutes: min });
      // libraryGridCellLine: time left for a started book, the length of one not started, never a percentage.
      const cellLine = b => b.left != null ? fmt('timeLeft', '{duration} left', { duration: durationText(b.left) })
        : b.len != null ? durationText(b.len) : null;

      // Flutter TextStyle.height: the line box is height x fontSize and the baseline sits at
      // height x fontSize x ascent / (ascent + descent). CSS centres the glyph box instead, so shift it.
      const METRICS = { HBInter: [0.96875, 0.2412] };

      const $ = id => document.getElementById(id);
      const stage = $('stage');

      function build() {
        // Locale first, then every string, so what gets measured below is the translated text.
        hbLocaleSetup();
        hbApplyStrings();

        // Phone centred on the canvas; the stage zoom fills the screen rect (cover, centred).
        const phone = $('phone'), host = $('screenHost'), wrap = $('stageWrap');
        const fw = FRAME.w * S, fh = FRAME.h * S;
        Object.assign(phone.style, { left: (3840 - fw) / 2 + 'px', top: (2160 - fh) / 2 + 'px', width: fw + 'px', height: fh + 'px' });
        const sw = SCREEN.w * S, sh = SCREEN.h * S;
        Object.assign(host.style, { left: SCREEN.x * S + 'px', top: SCREEN.y * S + 'px', width: sw + 'px', height: sh + 'px' });
        const zoom = Math.max(sw / STAGE_W, sh / STAGE_H);
        Object.assign(wrap.style, { left: (sw - STAGE_W * zoom) / 2 + 'px', top: (sh - STAGE_H * zoom) / 2 + 'px' });
        stage.style.zoom = zoom;

        // "Your books" count: entries.books.length.
        $('ybCount').textContent = String(BOOKS.length);

        // Grid: columns = max(1, ceil(width / kLibraryGridCellMaxWidth 124)), cell width from the 12 gaps.
        const grid = $('grid');
        const width = STAGE_W - 32;
        const columns = Math.max(1, Math.ceil(width / 124));
        const cellW = (width - 12 * (columns - 1)) / columns;
        grid.style.gridTemplateColumns = 'repeat(' + columns + ', ' + cellW + 'px)';
        grid.style.gridAutoRows = (cellW * 1.5 + 6 + 17 * 2 + 2 + 16) + 'px';
        BOOKS.forEach(b => {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const cover = document.createElement('div');
          cover.className = 'cover';
          cover.style.height = cellW * 1.5 + 'px';
          const img = document.createElement('img');
          img.src = '../../assets/covers/' + b.cover;
          img.alt = '';
          cover.appendChild(img);
          const title = document.createElement('div');
          title.className = 'cTitle';
          title.dataset.fh = String(17 / 13);
          title.textContent = b.title;
          cell.appendChild(cover);
          cell.appendChild(title);
          const line = cellLine(b);
          if (line != null) {
            const l = document.createElement('div');
            l.className = 'cLine';
            l.dataset.fh = String(16 / 12);
            l.textContent = line;
            cell.appendChild(l);
          }
          grid.appendChild(cell);
        });

        // TextStyle.height emulation.
        document.querySelectorAll('[data-fh]').forEach(el => {
          const cs = getComputedStyle(el), fs = parseFloat(cs.fontSize), hh = parseFloat(el.dataset.fh);
          const fam = cs.fontFamily.split(',')[0].replace(/["']/g, '').trim();
          const [a, d] = METRICS[fam] || METRICS.HBInter;
          el.style.lineHeight = hh * fs + 'px';
          el.style.position = 'relative';
          el.style.top = ((hh * a / (a + d)) - (hh / 2 + (a - d) / 2)) * fs + 'px';
        });
      }

      // A still: nothing moves.
      function render(t) {}

      // The covers are made in build(), after the page's load event: wait for them before saying ready.
      document.fonts.ready.then(() => {
        build();
        return Promise.all(Array.from(document.images).map(i => i.decode().catch(() => {})));
      }).then(() => {
        render(0);
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => render(clock.t) }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
        window.__hbReady = true;
      });
    </script>
  </body>
</html>

    <meta charset="UTF-8" />

    <style>
      /* HushBook iPhone player, cover face (D:\hushbook lib/features/player/cover, FolioTokens.cover).
         Device, status bar, fonts and transport from showcase/ios/ios-read-along. 393 x 852 pt stage. */
      @font-face{font-family:HBAtk;src:url('../../assets/fonts/AtkinsonHyperlegible-Regular.ttf');font-weight:400}
      @font-face{font-family:HBAtk;src:url('../../assets/fonts/AtkinsonHyperlegible-Bold.ttf');font-weight:700}
      @font-face{font-family:HBInter;src:url('../../assets/fonts/Inter-SemiBold.ttf');font-weight:600}

      *{box-sizing:border-box;margin:0;padding:0}
      html,body{margin:0;width:3840px;height:2160px;overflow:hidden;background:#FAF9F5}
      #root{position:relative;width:3840px;height:2160px;background:#FAF9F5}
      #app{position:absolute;inset:0;overflow:hidden}
      svg{display:block}
      #frame{position:absolute;pointer-events:none;z-index:2}
      /* The frame's transparent screen rect has square corners that reach past the device outline:
         clip the screen to a 400-unit radius (89.13 px at this size), as ios-offload does. */
      #screen{position:absolute;z-index:1;overflow:hidden}

      /* LyricsBackdrop (widgets/lyrics_backdrop.dart), drawn in screen px so the 73 dp blur is exact:
         the #22252C base, the cover (fit cover) blurred at sigma 73 with decal edges (ImageFiltered's
         default tile mode), and the 120 dp bottom fade. */
      #bg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#22252C}
      #bgImg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
      #bgFade{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(15,15,15,0),rgba(34,37,44,.851))}

      .stage{position:relative;width:393px;height:852px;overflow:hidden;color:var(--ink);
             font-family:HBAtk,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.25px;font-optical-sizing:none}

      /* Top bar (cover_layout.dart _TopBar): 56 tall, Back on a 44 disc in a 48 target, Read along at the end. */
      #topBar{position:absolute;left:14px;top:59px;width:365px;height:56px;display:flex;align-items:center}
      #backT{width:48px;height:48px;flex:none;display:grid;place-items:center}
      #backDisc{width:44px;height:44px;border-radius:50%;background:var(--button);display:grid;place-items:center;color:var(--ink)}
      #barGap{flex:1}
      #raPill{flex:none;height:48px;min-width:48px;border-radius:24px;background:var(--button);display:flex;align-items:center;padding:0 18px 0 14px;color:var(--ink)}
      #raPill span{margin-left:8px;font-weight:700;font-size:15px;line-height:18.75px;white-space:nowrap}

      /* The stage and the text under it (CoverArtView stage, _CoverInfo). */
      #body{position:absolute;left:24px;width:345px}
      #art{position:absolute;border-radius:14px;overflow:hidden;box-shadow:0 24px 70.28px rgba(0,0,0,.5),0 2px 10.24px rgba(0,0,0,.3)}
      #art img{display:block;width:100%;height:100%}
      #info{position:absolute;left:0;bottom:0;width:345px;text-align:center}
      #cTitle{font-weight:700;font-size:26px;line-height:30.68px;color:var(--ink)}
      #cAuthor{margin-top:4px;font-size:17px;line-height:22.1px;color:var(--secondary)}
      #cLeft{margin-top:12px;font-size:17px;line-height:22.44px;color:var(--secondary)}
      #cSleep{margin-top:2px;display:flex;align-items:center;justify-content:center;color:var(--rubric)}
      #cSleep svg{flex:none}
      #cSleep span{margin-left:6px;font-size:15px;line-height:20.1px;color:var(--secondary)}

      /* PlaybackControls(density: cover): scrubber, transport 12 below, pills 18 below. */
      #controls{position:absolute;left:24px;width:345px}
      #scrub{position:relative;height:64.1px}
      #track{position:absolute;left:0;right:0;top:0;height:48px}
      #tIn{position:absolute;top:21px;height:6px;border-radius:0 3px 3px 0;background:var(--track)}
      #tAc{position:absolute;left:0;top:20px;height:8px;border-radius:4px 0 0 4px;background:var(--rubric)}
      #thumb{position:absolute;top:12px;width:24px;height:24px;border-radius:50%;background:var(--ink);box-shadow:0 .5px 1.5px rgba(0,0,0,.3)}
      #times{position:absolute;left:0;right:0;top:44px;display:flex;align-items:center}
      .time{font-weight:700;font-size:15px;line-height:20.1px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
      .gap{flex:1}
      #transport{margin-top:12px;height:80px;display:flex;align-items:center;justify-content:space-between}
      .tb{display:grid;place-items:center;flex:none;color:var(--ink)}
      .tb.sec{color:var(--secondary)}
      .tb.dis{color:var(--disabled)}
      #disc{width:80px;height:80px;border-radius:50%;background:var(--rubric)}
      #pills{margin-top:18px}
      .prow{display:flex;align-items:stretch}
      .prow + .prow{margin-top:8px}
      .pill{min-height:56px;min-width:48px;border-radius:28px;background:var(--button);display:flex;align-items:center;justify-content:center;padding:7px 14px}
      .pill.on{background:var(--selected)}
      .pill .pi{flex:none;margin-right:8px;color:var(--secondary)}
      .pill.on .pi{color:var(--rubric)}
      .stk{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
      .pl{font-size:13px;line-height:16.9px;color:var(--secondary)}
      .pv{font-weight:700;font-size:16px;line-height:20px;color:var(--ink)}
      .prow.one .pl,.prow.one .pv{white-space:nowrap}
      .pgap{width:8px;flex:none}
      .pill.more{padding:0;color:var(--ink)}
      #meas{position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap}

      /* iOS chrome drawn over the app (cover mode: SystemUiOverlayStyle.light). */
      #sbar{position:absolute;left:0;top:0;width:393px;height:54px;color:#FFFFFF}
      #sbTime{position:absolute;left:24px;width:80px;top:19px;text-align:center;font-family:HBInter,sans-serif;font-size:17px;font-weight:600;letter-spacing:-.2px;line-height:22px}
      #sbIcons{position:absolute;left:293px;top:23px}
      #home{position:absolute;left:129.5px;bottom:8px;width:134px;height:5px;border-radius:2.5px;background:#FFFFFF}
    </style>

    <script>
      // ── Shot variables (hbVar) ──────────────────────────────────────────────────
      //   cover    key into BOOKS below: the cover file, title and author on screen ('hitchhikers')
      //   elapsed  seconds into the current chapter at t = 0 (166)
      //   length   the chapter's length in seconds (724 = 12:04)
      //   chapter  the chapter's number, 1-based; "Chapter 3" also works (1). The cover face has no
      //            chapter line: the number shows in the Chapters pill as "1 of 35".
      //   chapters how many chapters the book has (35)
      //   playing  the play disc shows pause while playing, play while paused (true)
      //   sleep    optional: minutes left on a sleep timer; adds the second status line and lights
      //            the Sleep pill (null = no timer)
      // Playing, the position advances with t (1 s per s at 1x); shots use t = 0.
      const BOOKS = {
        'hitchhikers':       { file: 'hitchhikers.jpg', title: "The Hitch-Hiker's Guide to the Galaxy", author: 'Douglas Adams' },
        'martian':           { file: 'the martian.webp', title: 'The Martian', author: 'Andy Weir' },
        'project-hail-mary': { file: 'projecthailmary.webp', title: 'Project Hail Mary', author: 'Andy Weir' },
        'lotr':              { file: 'LOR.jpg', title: 'The Lord of the Rings', author: 'J.R.R. Tolkien' },
        'love-hypothesis':   { file: 'LH.jpg', title: 'The Love Hypothesis', author: 'Ali Hazelwood' },
        'crime-punishment':  { file: 'crimeandpunishmentjpg.jpg', title: 'Crime and Punishment', author: 'Fyodor Dostoevsky' },
        'pride-prejudice':   { file: 'prideandprejudice.jpg', title: 'Pride and Prejudice', author: 'Jane Austen' },
        'fourth-wing':       { file: 'fourthwing.jpg', title: 'Fourth Wing', author: 'Rebecca Yarros' },
        'mexican-gothic':    { file: 'Mexicangothic.jpg', title: 'Mexican Gothic', author: 'Silvia Moreno-Garcia' },
        'dune':              { file: 'dune.jpg', title: 'Dune', author: 'Frank Herbert' },
        'born-a-crime':      { file: 'trevor_noah.jpg', title: 'Born a Crime', author: 'Trevor Noah' },
        'monte-cristo':      { file: 'alexandardumas.jpg', title: 'The Count of Monte Cristo', author: 'Alexandre Dumas' },
        'divine-comedy':     { file: 'comedy.jpg', title: 'The Divine Comedy', author: 'Dante Alighieri' },
        'odyssey':           { file: 'odessey.jpg', title: 'The Odyssey', author: 'Homer' },
        'fantastic-beasts':  { file: 'fantastic beasts.jpg', title: 'Fantastic Beasts and Where to Find Them', author: 'J.K. Rowling' },
        'dungeon-crawler-carl': { file: 'dungeon crawler carl.jpg', title: 'Dungeon Crawler Carl', author: 'Matt Dinniman' },
      };
      const BOOK = BOOKS[hbVar('cover', 'hitchhikers')] || BOOKS.hitchhikers;
      const ELAPSED = Number(hbVar('elapsed', 166));
      const LENGTH = Number(hbVar('length', 724));
      const CHAPTER = Math.max(1, parseInt(String(hbVar('chapter', 1)).replace(/[^0-9]+/g, ''), 10) || 1);
      const CHAPTERS = Math.max(CHAPTER, Number(hbVar('chapters', 35)));
      const PLAYING = hbVar('playing', true) !== false;
      const SLEEP = hbVar('sleep', null);
      const SPEED = 1;
      const DUR = 10;

      // ── FolioTokens.cover(): ambient, the warm cream ink over the blurred cover ──
      const TOK = {
        ink: '#F4E9DA', secondary: '#D3C7B6', rubric: '#E46A4F', button: 'rgba(244,233,218,.12)',
        selected: 'rgba(228,106,79,.26)', track: 'rgba(244,233,218,.24)',
        disabled: 'rgba(211,199,182,.45)',   // secondary at .45 (a disabled chapter skip)
      };

      // ── Geometry (stage px; cover_layout.dart, phone portrait) ──────────────────
      const SAFE_TOP = 59, SAFE_BOTTOM = 34, TOP_BAR = 56, GUTTER = 24, W = 393 - 2 * 24;
      const CONTROLS_BOTTOM = 852 - (SAFE_BOTTOM + 16);   // viewPadding.bottom + 16
      const CONTROLS_GAP = 16;                             // status lines -> scrubber
      const STAGE_INSETS = { top: 4, bottom: 18 }, STAGE_FACTOR = .82, STAGE_MAX = 360;

      const $ = id => document.getElementById(id);
      const stage = $('stage');
      let zoomZ = 1;
      const clock = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
        return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };
      const fill = (s, map) => s.replace(/\{(\w+)\}/g, (_, k) => (k in map ? String(map[k]) : '{' + k + '}'));
      const minutesUp = ms => ms < 60000 ? 0 : Math.ceil(ms / 60000);   // minutesLeftRoundedUp
      function leftLine(pos) {
        const m = minutesUp(Math.round(Math.max(0, LENGTH - pos) / SPEED * 1000));
        if (m === 0) return hbT('underMinuteLeftInChapter', 'Under a minute left in chapter');
        if (m === 1) return hbT('minuteLeftInChapter', '1 min left in chapter');
        return fill(hbT('minutesLeftInChapter', '{minutes} min left in chapter'), { minutes: m });
      }
      const textW = (text, cls) => { const m = $('meas'); m.className = cls; m.textContent = text; return Math.ceil(m.getBoundingClientRect().width / zoomZ); };
      const boxH = el => el.getBoundingClientRect().height / zoomZ;

      // ── AnimatedIcons.play_pause in its 48 box: 0 = play, 1 = pause ─────────────
      const PLAY = [[[16, 10], [27, 17], [27, 31], [16, 38]], [[27, 17], [38, 24], [38, 24], [27, 31]]];
      const PAUSE = [[[12, 10], [20, 10], [20, 38], [12, 38]], [[28, 10], [36, 10], [36, 38], [28, 38]]];
      function setGlyph(m) {
        [0, 1].forEach(k => $('g' + k).setAttribute('d', 'M' + PLAY[k].map((p, i) =>
          (p[0] + (PAUSE[k][i][0] - p[0]) * m).toFixed(2) + ' ' + (p[1] + (PAUSE[k][i][1] - p[1]) * m).toFixed(2)).join('L') + 'Z'));
      }

      // ── Pills (_PillRow + fitPills): one row with icons, else without, else a 2-column grid ──
      function buildPills() {
        const sleeping = SLEEP !== null && SLEEP !== undefined;
        const specs = [
          { icon: 'i-speedometer', label: hbT('pillSpeed', 'Speed'), value: SPEED + '×', on: false },
          { icon: sleeping ? 'i-moonFill' : 'i-moon', label: hbT('pillSleep', 'Sleep'),
            value: sleeping ? fill(hbT('pillSleepMinutes', '{minutes}m'), { minutes: SLEEP }) : hbT('sleepOff', 'Off'), on: sleeping },
        ];
        if (CHAPTERS > 1) specs.push({ icon: 'i-listBullet', label: hbT('chapters', 'Chapters'),
          value: fill(hbT('chaptersOf', '{current} of {total}'), { current: CHAPTER, total: CHAPTERS }), on: false });
        const HPAD = 14, ICON = 22 + 8, GAP = 8, MORE = 56;
        const tws = specs.map(p => Math.max(textW(p.label, 'pl'), textW(p.value, 'pv')));
        const rowW = icons => MORE + tws.reduce((a, w) => a + HPAD * 2 + w + (icons ? ICON : 0) + GAP, 0);
        const arrangement = rowW(true) <= W ? 'row' : rowW(false) <= W ? 'rowNoIcons' : 'grid2';
        const withIcons = arrangement === 'row';
        // Widths as Flutter's Expanded gives them (padding included): the row shares what More and
        // the gaps leave in proportion to each pill's natural width (x10); the grid's cells are even.
        const cellW = (W - GAP) / 2;
        const flex = tws.map(tw => Math.max(1, Math.round((HPAD * 2 + tw + (withIcons ? ICON : 0)) * 10)));
        const avail = W - MORE - specs.length * GAP, sum = flex.reduce((a, b) => a + b, 0);
        const pillW = i => arrangement === 'grid2' ? cellW : avail * flex[i] / sum;
        const pill = (p, i) => '<div class="pill' + (p.on ? ' on' : '') + '" style="flex:none;width:' + pillW(i).toFixed(3) + 'px">' +
          (withIcons ? '<svg class="pi" width="22" height="22"><use href="#' + p.icon + '"/></svg>' : '') +
          '<div class="stk"><div class="pl">' + p.label + '</div><div class="pv">' + p.value + '</div></div></div>';
        const more = w => '<div class="pill more" style="flex:none;width:' + w.toFixed(3) + 'px">' +
          '<svg width="22" height="22"><use href="#i-ellipsis"/></svg></div>';
        let html = '';
        if (arrangement === 'grid2') {
          const cells = specs.map(pill).concat([more(cellW)]);
          for (let i = 0; i < cells.length; i += 2)
            html += '<div class="prow">' + cells[i] + '<div class="pgap"></div>' + (cells[i + 1] || '<div style="flex:none;width:' + cellW.toFixed(3) + 'px"></div>') + '</div>';
        } else {
          html = '<div class="prow one">' + specs.map((p, i) => pill(p, i) + '<div class="pgap"></div>').join('') + more(MORE) + '</div>';
        }
        $('pills').innerHTML = html;
        return arrangement;
      }

      // ── The cover's column: bar, stage (what is left), text, controls low ───────
      let LAYOUT = null;
      function layoutCover() {
        // Transport (spaceBetween; the 30 s skips sized to the room, 48..64).
        const size = Math.min(64, Math.max(48, (W - 80 - 96) / 2));
        $('tBack').style.width = size + 'px'; $('tFwd').style.width = size + 'px';
        $('tPrev').className = 'tb ' + (CHAPTER > 1 ? 'sec' : 'dis');
        $('tNext').className = 'tb ' + (CHAPTER < CHAPTERS ? 'sec' : 'dis');
        const arrangement = buildPills();

        const controls = $('controls');
        const controlsH = boxH(controls);
        const controlsTop = CONTROLS_BOTTOM - controlsH;
        controls.style.top = controlsTop + 'px';

        // The body: between the bar and the controls' 16 dp gap.
        const bodyTop = SAFE_TOP + TOP_BAR, bodyBottom = controlsTop - CONTROLS_GAP;
        const available = bodyBottom - bodyTop;
        const body = $('body');
        body.style.top = bodyTop + 'px'; body.style.height = available + 'px';
        const infoH = boxH($('info'));
        const zone = available - infoH;   // >= 160 here: the stage arrangement (art centred over centred text)

        // CoverArtView: contain the art's own shape in the stage, 82% of the width, at most 360.
        const img = $('artImg'), ratio = img.naturalWidth / img.naturalHeight;
        const maxW = Math.min(STAGE_MAX, W * STAGE_FACTOR), maxH = zone - STAGE_INSETS.top - STAGE_INSETS.bottom;
        const w = Math.min(maxW, maxH * ratio), h = w / ratio;
        const art = $('art');
        art.style.left = ((W - w) / 2) + 'px'; art.style.top = (STAGE_INSETS.top + (maxH - h) / 2) + 'px';
        art.style.width = w + 'px'; art.style.height = h + 'px';
        LAYOUT = { controlsH, controlsTop, available, infoH, zone, art: { w, h, ratio }, arrangement };
      }

      function render(t) {
        const pos = Math.min(LENGTH, ELAPSED + (PLAYING ? t * SPEED : 0));
        $('cLeft').textContent = leftLine(pos);
        $('elapsed').textContent = clock(pos);
        $('remaining').textContent = '−' + clock(LENGTH - pos);
        const tw = W, cx = tw * Math.min(1, pos / LENGTH);
        $('tAc').style.width = cx + 'px';
        $('tIn').style.left = cx + 'px'; $('tIn').style.width = (tw - cx) + 'px';
        $('thumb').style.left = (cx - 12) + 'px';
      }

      // ── Static pieces ────────────────────────────────────────────────────────────
      function statusIcons() {
        let d = '';
        [[0, 7], [4.6, 5], [9.2, 2.6], [13.8, 0]].forEach(([x, y]) => { d += '<rect x="' + x + '" y="' + (1 + y) + '" width="3.2" height="' + (11 - y) + '" rx="1"/>'; });
        const cx = 30.65, cy = 11.6, a = Math.PI / 4;
        const pt = (r, s) => (cx + r * Math.sin(s * a)).toFixed(2) + ' ' + (cy - r * Math.cos(s * a)).toFixed(2);
        const sector = (r0, r1) => r0 === 0
          ? 'M' + cx + ' ' + cy + 'L' + pt(r1, -1) + 'A' + r1 + ' ' + r1 + ' 0 0 1 ' + pt(r1, 1) + 'Z'
          : 'M' + pt(r0, -1) + 'L' + pt(r1, -1) + 'A' + r1 + ' ' + r1 + ' 0 0 1 ' + pt(r1, 1) + 'L' + pt(r0, 1) + 'A' + r0 + ' ' + r0 + ' 0 0 0 ' + pt(r0, -1) + 'Z';
        d += '<path d="' + sector(0, 3.3) + sector(5.0, 7.0) + sector(8.7, 10.8) + '"/>';
        d += '<rect x="45.5" y=".5" width="25" height="12" rx="3.8" fill="none" stroke="currentColor" stroke-opacity=".35"/>';
        d += '<rect x="47.5" y="2.5" width="21" height="8" rx="2"/>';
        d += '<path d="M72 4.5c.9.3 1.5 1.1 1.5 2s-.6 1.7-1.5 2Z" fill-opacity=".4"/>';
        $('sbG').innerHTML = d;
      }
      let SCREEN_Z = 1;
      function placeDevice() {
        // frame-iphone.png 4317 x 8796, screen x 199..4111, y 168..8653; 1960 px tall, centred.
        const s = 1960 / 8796, fw = 4317 * s, fl = (3840 - fw) / 2, ft = (2160 - 1960) / 2;
        const fr = $('frame');
        fr.style.left = fl + 'px'; fr.style.top = ft + 'px'; fr.style.width = fw + 'px'; fr.style.height = '1960px';
        const sw = 3913 * s, sh = 8486 * s, z = Math.max(sw / 393, sh / 852);
        const sc = $('screen');
        sc.style.left = (fl + 199 * s) + 'px';
        sc.style.top = (ft + 168 * s) + 'px';
        sc.style.width = sw + 'px'; sc.style.height = sh + 'px';
        sc.style.borderRadius = (400 * s) + 'px';
        stage.style.marginLeft = ((sw - 393 * z) / 2 / z) + 'px';
        stage.style.zoom = z;
        SCREEN_Z = z;
        // The backdrop lives in screen px: sigma 73 dp and the 120 dp fade scaled by the same zoom.
        $('bgImg').style.filter = 'blur(' + (73 * z).toFixed(3) + 'px)';
        $('bgFade').style.height = (120 * z).toFixed(3) + 'px';
      }

      placeDevice();
      const coverSrc = '../../assets/covers/' + encodeURIComponent(BOOK.file);
      $('artImg').src = coverSrc;
      $('bgImg').src = coverSrc;
      for (const k in TOK) stage.style.setProperty('--' + k, TOK[k]);

      // Every face the scene measures with, loaded before measuring (fonts.ready only covers faces in use).
      const FACES = ['400 17px HBAtk', '700 26px HBAtk', '600 17px HBInter'];
      document.fonts.ready
        .then(() => Promise.all(FACES.map(f => document.fonts.load(f)).concat([$('artImg').decode(), $('bgImg').decode()])))
        .then(() => {
          hbLocaleSetup();
          hbApplyStrings();
          zoomZ = stage.getBoundingClientRect().width / 393;
          statusIcons();
          $('cTitle').textContent = BOOK.title;
          $('cAuthor').textContent = BOOK.author;
          const sleeping = SLEEP !== null && SLEEP !== undefined;
          $('cSleep').style.display = sleeping ? 'flex' : 'none';
          if (sleeping) $('cSleepT').textContent = fill(hbT('sleepInMinutes', 'Sleep in {minutes} min'), { minutes: SLEEP });
          setGlyph(PLAYING ? 1 : 0);
          render(0);
          layoutCover();
          render(0);
          window.__dbg = () => ({ zoom: zoomZ, screenZ: SCREEN_Z, layout: LAYOUT, book: BOOK.title });

          const tl = gsap.timeline({ paused: true });
          const clockProxy = { t: 0 };
          tl.to(clockProxy, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => render(clockProxy.t) }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          window.__hbReady = true;
        });
    </script>
  </body>
</html>

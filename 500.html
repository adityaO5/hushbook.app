<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something went wrong — HushBook</title>
<meta name="description" content="HushBook ran into a temporary server problem.">
<meta name="theme-color" content="#0B0A09">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/assets/img/default_preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A09; --panel:#17130F; --line:rgba(201,163,106,.2);
  --ink:#F5EFE6; --muted:#A89F90; --gold:#C9A36A; --gold-hi:#E8C893; --cream:#FBF8F2;
}
*{box-sizing:border-box}
body{
  min-height:100vh; margin:0; display:grid; place-items:center;
  background:radial-gradient(circle at 50% 18%,rgba(201,163,106,.17),transparent 38%),var(--bg);
  color:var(--ink); font-family:"Hanken Grotesk",system-ui,sans-serif; padding:24px;
}
main{
  width:min(560px,100%); text-align:center;
  background:linear-gradient(150deg,rgba(23,19,15,.96),rgba(13,11,9,.98));
  border:1px solid var(--line); border-radius:30px;
  padding:clamp(34px,7vw,64px); box-shadow:0 30px 90px rgba(0,0,0,.45);
}
.logo{width:56px;height:56px;margin:0 auto 20px;border-radius:16px;filter:brightness(0) invert(1)}
.code{
  display:inline-block; font-size:13px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--gold); margin-bottom:14px;
}
h1{
  font-family:"Fraunces",Georgia,serif; font-size:clamp(32px,6vw,48px);
  line-height:1.08; margin:0 0 14px; font-weight:500;
}
.status{color:var(--muted); font-size:17px; margin:0 auto 28px; max-width:36ch; line-height:1.55}
.actions{display:flex; justify-content:center; gap:12px; flex-wrap:wrap}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:160px; padding:13px 22px; border-radius:999px;
  font-weight:700; font-size:15px; text-decoration:none; border:0; cursor:pointer;
  font-family:inherit;
  transition:transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .2s;
}
.btn-primary{
  background:var(--cream); color:#171310;
  box-shadow:0 12px 30px rgba(0,0,0,.3);
}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 18px 40px rgba(201,163,106,.22)}
.btn-ghost{
  border:1px solid var(--line); color:var(--ink); background:transparent;
}
.btn-ghost:hover{border-color:var(--gold); color:var(--gold-hi)}
.btn:focus-visible{outline:3px solid var(--gold-hi); outline-offset:4px}
@media(max-width:540px){main{padding:38px 22px}.btn{width:100%}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/img/logo.png" alt="">
  <p class="code">Error 500</p>
  <h1>Something snagged mid-page</h1>
  <p class="status">We hit a temporary problem on our side. Try again in a moment — your place in the book is safe.</p>
  <div class="actions">
    <button class="btn btn-primary" type="button" onclick="location.reload()">Try again</button>
    <a class="btn btn-ghost" href="/">Back to home</a>
  </div>
</main>
</body>
</html>

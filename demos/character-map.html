/* ───────── Fonts (bundled in the app; files live next to this deck in fonts/) ───────── */
@font-face{font-family:Inter;src:url(/assets/fonts/Inter-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(/assets/fonts/Inter-Medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(/assets/fonts/Inter-SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(/assets/fonts/Inter-Bold.ttf) format("truetype");font-weight:700;font-display:swap}

/* ───────── Real app tokens (HbColors / DesignTokens) ───────── */
:root{
  --cream:#FBF8F2; --card-cream:#F7F4EE; --ink:#2F2F2F; --muted:#666; /* app #858585 is 3.5:1 on cream; deck uses #666 */
  --accent:#6F3825; --accent-deep:#64210A; --divider:#E8E0D4; --dotgrid:#E3D4B5; --banner:#EDE5D4;
  --i1:#F8D5C8; --i2:#F2A085; --i3:#DC6B50; --i4:#A33F35;
  --d-bg:#0E0E0E; --d-sheet:#161618; --d-surface:#1C1C1E; --d-ink:#F2F2F2; --d-sec:#A9A9AB; --d-accent:#C98A6A;
  --serif:Newsreader,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --display:"Playfair Display",Newsreader,Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --page:#EFEAE0;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:96px}
a{color:var(--accent-deep)}
code{font-size:.92em;background:#E6DFD1;padding:1px 5px;border-radius:4px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.page{max-width:1320px;margin:0 auto;padding:40px 24px 64px}
h1{font:500 44px/1.08 var(--serif);letter-spacing:-.015em;margin:0 0 14px;max-width:20ch}
h2{font:700 22px/1.25 var(--sans);margin:0 0 4px}
h3{font:600 16px/1.3 var(--sans);margin:0}
.lede{max-width:68ch;color:#4a4a4a;margin:0 0 20px;font-size:17px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.toc a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid #D9CFBD;border-radius:22px;background:#fff;text-decoration:none;color:var(--ink);font-weight:500}
.howto{font-size:14px;color:var(--muted);margin:0 0 48px;max-width:70ch}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}

/* axis header */
.axis{margin:64px 0 28px;padding-top:28px;border-top:2px solid var(--ink);scroll-margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.axis .ax-id{font:600 15px var(--sans);color:var(--accent-deep)}
.axis h2{font:500 34px/1.12 var(--serif);letter-spacing:-.01em;margin:0}
.axis p{margin:6px 0 0;max-width:72ch;color:#4a4a4a}

section.var{margin:0 0 64px;scroll-margin-top:16px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px;max-width:1100px}
.vhead .vt{max-width:66ch}
.vhead .tag{display:inline-block;font:600 13px var(--sans);color:var(--accent-deep);margin-right:8px}
.vhead .rec{display:inline-block;font:600 12px var(--sans);color:#fff;background:var(--accent-deep);padding:3px 10px;border-radius:12px;vertical-align:3px;margin-left:6px}
.vhead .fb{display:inline-block;font:600 12px var(--sans);color:var(--ink);background:#E3D9C6;padding:3px 10px;border-radius:12px;vertical-align:3px;margin-left:6px}
.vhead p{margin:4px 0 0;color:#4a4a4a}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;min-width:44px;padding:0 16px;border-radius:22px;border:1px solid #c9bfa9;background:#fff;color:var(--ink);font:500 14px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed=true]{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.chip.pick[aria-pressed=true]::before{content:"";width:14px;height:8px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-2px)}
.chip:hover{border-color:var(--accent)}
.stage{display:flex;flex-wrap:wrap;gap:28px 32px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* notes panel */
.notes{flex:1 1 280px;max-width:380px;display:grid;gap:14px;align-content:start}
.notes .n{background:#FAF7F1;border:1px solid #DDD3C2;border-radius:14px;padding:14px 16px}
.notes .n b{display:block;font:600 14px var(--sans);margin-bottom:4px}
.notes .n p{margin:0;font-size:14px;line-height:1.5;color:#4a4a4a}
.notes .n ul{margin:0;padding-left:18px;font-size:14px;color:#4a4a4a}
.notes .ref{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.notes .ref svg{width:64px;height:64px;border-radius:12px;background:#F5EFE3;flex:none}

/* step strip */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none;max-width:390px}
.steps button{min-height:44px;padding:0 12px;border-radius:22px;border:1px solid #D2C7B3;background:#fff;color:#4a4a4a;font:500 13px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.steps button i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:10px;background:#EFE7DA;font-size:12px;font-weight:600;color:var(--ink)}
.steps button[aria-current=step]{border-color:var(--accent-deep);color:var(--accent-deep);font-weight:600}
.steps button[aria-current=step] i{background:var(--accent-deep);color:#fff}
.steps button.done i{background:#CDBFA6}

/* haptic indicator */
.haptic{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px 0 8px;border-radius:16px;background:#fff;border:1px solid #DDD3C2;font:500 13px var(--sans);color:#555}
.haptic .hz{position:relative;width:18px;height:18px;border-radius:9px;background:#D7CCBA}
.haptic.on{color:var(--accent-deep);border-color:var(--accent)}
.haptic.on .hz{background:var(--accent-deep);animation:hz .45s ease-out 2}
.haptic.on .hz::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);animation:hzr .6s ease-out}
@keyframes hz{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes hzr{from{transform:scale(.5);opacity:1}to{transform:scale(1.6);opacity:0}}

/* ───────── phone ───────── */
.phone{position:relative;width:390px;height:800px;flex:none;border-radius:46px;border:10px solid #141414;background:#000;overflow:hidden;box-shadow:0 24px 60px rgba(40,25,10,.25)}
.scr{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--ink-c);font-family:var(--sans);
  --bg:var(--cream);--surface:var(--card-cream);--sheet:var(--cream);--ink-c:var(--ink);--sec:var(--muted);--acc:var(--accent);--btn:var(--accent-deep);--btn-ink:#fff;--line:var(--divider);--dot:var(--dotgrid);--pill:#FFFDF8;--edge:var(--accent);--chipbg:#fff}
.phone.dark .scr{--bg:#0E0E0E;--surface:#1C1C1E;--sheet:#161618;--ink-c:#F2F2F2;--sec:#A9A9AB;--acc:#C98A6A;--btn:#C98A6A;--btn-ink:#161618;--line:#2C2C2E;--dot:#2B2723;--pill:#1C1C1E;--edge:#C98A6A;--chipbg:#1C1C1E}
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font:600 15px var(--sans);flex:none;position:relative;z-index:5}
.sb .ic{display:flex;gap:5px;align-items:center}
.sb .ic i{display:block;width:17px;height:10px;border-radius:2px;background:currentColor;opacity:.9}
.sb .ic i:first-child{width:15px;clip-path:polygon(0 100%,100% 0,100% 100%)}
.sb .ic i:last-child{width:22px;height:11px;border-radius:3px;background:none;border:1.5px solid currentColor;box-shadow:inset 0 0 0 1.5px var(--bg);background-clip:content-box;padding:1px;background-color:currentColor}
.col-fill{position:absolute;inset:0;display:flex;flex-direction:column}
.nav{display:flex;align-items:center;gap:4px;padding:0 8px;height:52px;flex:none}
.nav .ttl{font:400 23px/1 var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .sub{display:block;font:400 12px var(--sans);color:var(--sec);margin-top:3px}
.ibtn{width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn svg{width:22px;height:22px}
.dotpaper{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:18px 18px}

/* medallions */
.med{position:relative;display:inline-block;border-radius:50%;overflow:hidden;background:var(--disc,#EDE5D4);flex:none;box-shadow:0 0 0 1.5px rgba(47,47,47,.12) inset}
.med svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.med.live svg,.med.breathe svg{transform-origin:50% 92%;animation:breathe 3.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015) translateY(-.6%)}}
.med.react svg{animation:reactSq .5s var(--spring)}
@keyframes reactSq{0%{transform:scale(1)}35%{transform:scale(1.08,.94)}100%{transform:scale(1)}}
.cast-cell{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:inherit;cursor:pointer;font:inherit;min-width:0}
.cast-cell .nm{font:400 14px/1.15 var(--display);text-align:center;max-width:104px}
.cast-cell[aria-pressed=true] .med{box-shadow:0 0 0 3px var(--btn)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;padding:6px 18px 0}

/* gradient blobs (as shipped) */
.blob{position:relative;border-radius:50%;flex:none;overflow:hidden}
.blob::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.55),rgba(255,255,255,0) 38%)}
.blob.breathe{animation:breathe2 2.3s ease-in-out infinite}
@keyframes breathe2{0%,100%{transform:scale(1)}50%{transform:scale(1.028)}}

/* builder tray */
.tray{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(40,25,10,.14);padding:8px 18px 22px;z-index:6}
.phone.dark .tray{box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.grab{width:40px;height:5px;border-radius:3px;background:currentColor;opacity:.25;margin:2px auto 10px}
.tray h4{font:600 17px/1.25 var(--sans);margin:0}
.tray .hint{font-size:13px;color:var(--sec);margin:2px 0 0}
.tabs2{display:flex;gap:6px;margin:10px 0 10px}
.tabs2 button{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--chipbg);color:var(--ink-c);font:500 13px var(--sans);cursor:pointer}
.tabs2 button[aria-selected=true]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{aspect-ratio:1;border-radius:16px;border:1.5px solid var(--line);background:var(--chipbg);padding:4px;cursor:pointer;display:grid;place-items:center;min-height:44px;color:inherit}
.opt[aria-pressed=true]{border-color:var(--btn);box-shadow:0 0 0 2px var(--btn) inset}
.opt .med{width:100%;height:100%}
.optrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.optrow::-webkit-scrollbar{display:none}
.optrow .opt{flex:0 0 60px;height:60px;aspect-ratio:auto}
.olabel{font:500 13px var(--sans);color:var(--sec);margin:10px 0 6px}
.pillbtn{min-height:48px;padding:0 22px;border:0;border-radius:24px;background:var(--btn);color:var(--btn-ink);font:600 16px var(--sans);cursor:pointer}
.pillbtn.ghost{background:transparent;color:var(--ink-c);border:1px solid var(--line)}
.pillbtn:active{transform:scale(.97)}
.rowbtns{display:flex;gap:10px;margin-top:14px}
.rowbtns .pillbtn{flex:1}

/* text chips (app ChoiceChip-like) */
.tchip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--chipbg);color:var(--ink-c);font:500 13px var(--sans);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tchip[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.tchip .med{width:24px;height:24px}
.field{display:flex;align-items:center;gap:8px;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px;background:var(--chipbg)}
.field input{flex:1;min-width:0;border:0;background:transparent;font:500 16px var(--sans);color:var(--ink-c);height:44px}
.field input:focus{outline:none}
.field:focus-within{border-color:var(--btn)}
.flabel{display:block;font:500 13px var(--sans);color:var(--sec);margin:12px 0 6px}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:9;background:#2B2622;color:#F7F1E8;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font:500 14px var(--sans);transform:translateY(140%);opacity:0;transition:transform .32s var(--out),opacity .2s}
.toast.on{transform:none;opacity:1}
.toast button{margin-left:auto;min-height:40px;padding:0 14px;border-radius:20px;border:0;background:#F7F1E8;color:#2B2622;font:600 13px var(--sans);cursor:pointer}

/* ───────── lyrics player ───────── */
.player{position:absolute;inset:0;color:#fff;background:#1d1611}
.player .amb{position:absolute;inset:-40px;background:radial-gradient(60% 40% at 30% 20%,#7a5638 0,transparent 70%),radial-gradient(50% 40% at 80% 60%,#4b5a3f 0,transparent 70%),radial-gradient(70% 50% at 40% 90%,#5a2e22 0,transparent 70%),#1d1611;filter:blur(30px)}
.player .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.55) 75%)}
.player .top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.player .seg{display:flex;background:rgba(255,255,255,.14);border-radius:18px;padding:3px}
.player .seg span{font:600 12px var(--sans);padding:6px 12px;border-radius:15px;color:rgba(255,255,255,.8)}
.player .seg span.on{background:rgba(255,255,255,.9);color:#2a1f17}
.lyr{position:relative;z-index:2;padding:18px 26px 0;height:440px;overflow:hidden}
.lyr .ln{font:700 27px/1.24 var(--sans);letter-spacing:-.01em;margin:0 0 14px;color:rgba(255,255,255,.34);transition:color .3s,transform .4s var(--out),opacity .3s;transform-origin:left center}
.lyr .ln.cur{color:rgba(255,255,255,.55)}
.lyr .ln.past{opacity:.6}
.lyr .w{display:inline;border-radius:6px;transition:color .18s}
.lyr .ln.cur .w.sung{color:#fff}
.lyr .w.name{text-decoration:underline dotted rgba(255,255,255,.55);text-underline-offset:5px;text-decoration-thickness:2px;cursor:pointer;position:relative}
.lyr .w.name.hold{background:rgba(255,255,255,.18)}
.lyr .w.name.picked{background:#F7F1E8;color:#2a1f17!important;text-decoration:none;padding:0 4px}
.lyr .w.name .ring{position:absolute;left:50%;top:-34px;width:28px;height:28px;margin-left:-14px;pointer-events:none}
.lyr-wrap{position:relative;transition:transform .45s var(--out)}
.ph-hint{position:relative;z-index:2;margin:0 18px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font:500 13px/1.35 var(--sans);color:#fff}
.ph-hint svg{width:22px;height:22px;flex:none}
.npr{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 18px 24px}
.npr .row{display:flex;align-items:center;gap:12px}
.npr .cov{width:46px;height:50px;border-radius:6px;background:linear-gradient(160deg,#9b6b46,#4b2e20);box-shadow:0 4px 10px rgba(0,0,0,.35);position:relative;overflow:hidden}
.npr .cov::after{content:"P&P";position:absolute;inset:0;display:grid;place-items:center;font:italic 600 13px var(--serif);color:#f3e2c7}
.npr .t{flex:1;min-width:0}
.npr .t b{display:block;font:600 15px var(--sans)}
.npr .t span{font-size:13px;color:rgba(255,255,255,.72)}
.npr .pp{width:44px;height:44px;border-radius:22px;background:#fff;color:#2a1f17;display:grid;place-items:center}
.npr .scrub{margin:14px 0 4px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);position:relative}
.npr .scrub i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff;width:var(--p,38%)}
.npr .times{display:flex;justify-content:space-between;font:500 12px var(--sans);color:rgba(255,255,255,.72)}
.playing-eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px;vertical-align:-1px}
.playing-eq i{width:3px;background:currentColor;border-radius:1px;animation:eq 1s ease-in-out infinite}
.playing-eq i:nth-child(2){animation-delay:-.4s}.playing-eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}

/* meet card */
.meet{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,14,10,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.meet.on{opacity:1;pointer-events:auto}
.meet .card{width:290px;background:var(--cream);color:var(--ink);border-radius:28px;padding:26px 22px 22px;text-align:center;transform:scale(.6);opacity:0;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.meet.on .card{animation:pop .62s var(--spring) forwards}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
.meet .card .med{width:132px;height:132px;margin:0 auto 12px;display:block}
.meet .card h4{font:500 30px/1.1 var(--serif);margin:0 0 8px}
.meet .card .hand{font:italic 400 17px/1.3 var(--serif);color:var(--accent);margin:0;position:relative;display:inline-block}
.meet .card .hand svg{position:absolute;left:-4px;right:-4px;bottom:-8px;width:calc(100% + 8px);height:10px}
.meet .card .rel{font-size:13px;color:var(--muted);margin:14px 0 0}
.sparkles path{transform-box:fill-box;transform-origin:center}
.meet.on .sparkles path{animation:spk .7s var(--spring) both}
.meet.on .sparkles path:nth-child(2){animation-delay:.12s}.meet.on .sparkles path:nth-child(3){animation-delay:.22s}
@keyframes spk{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}

/* book detail */
.bd{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.bd-head{display:flex;gap:12px;align-items:center;padding:0 18px 12px}
.bd-head .cov{width:52px;height:74px;border-radius:6px;background:linear-gradient(160deg,#9b6b46,#4b2e20);display:grid;place-items:center;color:#f3e2c7;font:italic 600 14px var(--serif);flex:none}
.bd-head b{display:block;font:400 22px/1.15 var(--display)}
.bd-head span{font-size:13px;color:var(--sec)}
.btabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);flex:none}
.btabs span{font:500 14px var(--sans);padding:12px 10px;color:var(--sec);border-bottom:2px solid transparent}
.btabs span.on{color:var(--ink-c);border-color:var(--ink-c);font-weight:600}
.bd-body{flex:1;overflow-y:auto;padding:14px 16px 28px;scrollbar-width:thin}
.minimap{position:relative;border-radius:20px;border:1px solid var(--line);overflow:hidden;height:190px;margin-bottom:16px;cursor:pointer;display:block;width:100%;padding:0;text-align:left;font:inherit;color:inherit}
.minimap svg.mm{position:absolute;inset:0;width:100%;height:100%}

/* map canvas */
.map{position:absolute;left:0;right:0;top:96px;bottom:0}

/* corkboard */

    this.svg=$('svg.edges',host); this.defs=$('defs',this.svg); this.bg=$('.bg',this.svg); this.eg=$('.eg',this.svg); this.fx=$('.fx',this.svg);

    b.innerHTML=this.avatar(c,id)+(o.noName?'':`<span class="nm">${c.name}</span>`); b.style.left=x+'px'; b.style.top=y+'px';
    if(o.rot) b.style.rotate=o.rot+'deg';

  }
  node(id){return $(`.node[data-id="${id}"]`,this.host);}
  med(id){const n=this.node(id);return n&&(n.querySelector('.med')||n.querySelector('.blob'));}
  move(id,x,y){this.pos[id]={x,y};const n=this.node(id);n.style.left=x+'px';n.style.top=y+'px';}
  hint(t){ if(this.hintEl) this.hintEl.textContent=t; }
  tap(id){
    if(this.onTap&&this.onTap(id)===false) return;
    if(!this.sel){ this.sel=id; this.node(id).classList.add('sel'); haptic(this.section,'Light impact: picked up'); this.hint("Tap who they're linked to"); return; }
    if(this.sel===id){ this.node(id).classList.remove('sel'); this.sel=null; this.hint(''); return; }
    const a=this.sel; this.node(a).classList.remove('sel'); this.sel=null;
    this.connect(a,id,this.type,null,{animate:true});

  connect(a,b,type,label,o={}){

  }
  clearEdges(keep){ this.edges=this.edges.filter(e=>{ if(keep&&keep(e)) return true; e.g.remove(); return false; }); }
  redraw(){ this.edges.forEach(e=>{ e.g.remove(); this.render(e,false); }); }
  ends(e){ let A=this.pos[e.a],B=this.pos[e.b]; if(this.style==='cork'){A={x:A.x,y:A.y-44};B={x:B.x,y:B.y-44};} return [A,B]; }
  render(e,animate,onDone){
    const [A,B]=this.ends(e); const seed=hash(e.a+'|'+e.b); const g=svgEl('g',{class:'edge'},this.eg); e.g=g;
    let center, extra=null;
    if(this.style==='ink'){
      const bend=(((seed%7)-3)*.03)+.07, n=e.type==='rivalry'?90:52, {pts}=curve(A,B,bend,n);
      const wob=p=>({x:p.x+p.nx*Math.sin(p.t*17+seed%10)*.9,y:p.y+p.ny*Math.sin(p.t*17+seed%10)*.9,nx:p.nx,ny:p.ny,t:p.t});
      const wp=pts.map(wob); center=D(pts);
      const st=(w,dash)=>`stroke:${e.type==='unknown'?'#9B9285':'var(--edge)'};stroke-width:${w};fill:none;stroke-linecap:round;stroke-linejoin:round;${dash?'stroke-dasharray:'+dash:''}`;
      if(e.type==='family'){ svgEl('path',{d:D(wp,off(2.4)),style:st(1.5)},g); svgEl('path',{d:D(wp,off(-2.4)),style:st(1.5)},g); }
      else if(e.type==='rivalry'){ svgEl('path',{d:D(wp,(p,i)=>p.t>.36&&p.t<.64?{x:p.x+p.nx*(i%2?5.5:-5.5),y:p.y+p.ny*(i%2?5.5:-5.5)}:p),style:st(2)},g); }
      else if(e.type==='secret') svgEl('path',{d:D(wp),style:st(2.8,'.5 7')},g);
      else if(e.type==='unknown') svgEl('path',{d:D(wp),style:st(2.2,'9 7')},g);
      else svgEl('path',{d:D(wp),style:st(2)},g);
      extra=()=>{ if(e.type==='mentor'){ const L=this._len(center), p=this._pt(center,L-this.nodeR-6), q=this._pt(center,L-this.nodeR-18); const ang=Math.atan2(p.y-q.y,p.x-q.x)*180/Math.PI;
          svgEl('path',{d:'M0 0L-12 -6L-9 0L-12 6Z',transform:`translate(${p.x} ${p.y}) rotate(${ang})`,style:'fill:var(--edge)'},g);} };

      const {pts}=curve(A,B,.12,40); center=D(pts);

    } else if(this.style==='sky'){
      center=`M${A.x} ${A.y}L${B.x} ${B.y}`;
      svgEl('path',{d:center,style:'stroke:#E9C9A8;stroke-width:7;opacity:.16;fill:none;stroke-linecap:round'},g);
      svgEl('path',{d:center,style:`stroke:#F3DFC7;stroke-width:1.3;fill:none;${e.type==='secret'?'stroke-dasharray:2 5;':''}`},g);
      const hit=svgEl('path',{d:center,class:'hit',style:'stroke:transparent;stroke-width:18;fill:none'},g);
      hit.addEventListener('click',()=>{ const p=$('.pill-w',g); if(p){p.remove();} else this._pill(e,center,g,true); });
    }
    if(this.style==='thread'){ onDone&&onDone(); return; }
    const finish=()=>{
      extra&&extra();
      if(this.style==='sky'){ if(animate){ this._pill(e,center,g,true); setTimeout(()=>{const p=$('.pill-w',g); p&&p.remove();},1800);} }
      else this._pill(e,center,g,animate);
      if(animate){ this._blot(center); mood(this.med(e.a)); mood(this.med(e.b)); haptic(this.section,'Success haptic: link made'); if(this.style==='cork') this._sway(e); if(this.pairCard) this._pairCard(e); }
      onDone&&onDone();
    };
    if(!animate||REDUCED()){ if(animate&&REDUCED()){ g.style.opacity=0; requestAnimationFrame(()=>{g.style.transition='opacity .15s';g.style.opacity=1;}); } finish(); return; }
    // draw-on: reveal through a growing mask, led by an ink nib
    const mid=uid('mk'); const m=svgEl('mask',{id:mid,maskUnits:'userSpaceOnUse',x:-400,y:-400,width:1400,height:1600},this.defs);
    const mp=svgEl('path',{d:center,style:'stroke:#fff;stroke-width:26;fill:none;stroke-linecap:round'},m);
    const L=mp.getTotalLength(); mp.style.strokeDasharray=L; mp.style.strokeDashoffset=L; g.setAttribute('mask',`url(#${mid})`);
    const nib=svgEl('circle',{r:3,style:`fill:${this.style==='sky'?'#FFF3E0':this.style==='cork'?(YARN[e.type]||'#333'):'var(--edge)'}`},this.fx);
    const t0=performance.now(), dur=this.style==='cork'?560:450;
    const tick=now=>{ const t=Math.min(1,(now-t0)/dur), k=1-Math.pow(1-t,3); mp.style.strokeDashoffset=L*(1-k);
      const p=mp.getPointAtLength(L*k); nib.setAttribute('cx',p.x); nib.setAttribute('cy',p.y); nib.setAttribute('r',3*(1-k)+1.5);
      if(t<1) requestAnimationFrame(tick); else { nib.remove(); g.removeAttribute('mask'); m.remove(); setTimeout(finish,80); } };
    requestAnimationFrame(tick);
  }
  _pairCard(e){
    $$('.pair',this.host).forEach(x=>x.remove());
    const A=this.cast[e.a], B=this.cast[e.b]; const d=document.createElement('div'); d.className='pair'; d.setAttribute('role','status');
    d.innerHTML=`<span class="pfaces">${peep(A,{size:46,face:'smileBig'})}${peep(B,{size:46,face:'smileBig'})}</span><span class="ptx"><b>${esc(A.name)} and ${esc(B.name)}</b><span class="pl">${esc(e.label)}</span></span>`;
    this.host.appendChild(d);
    if(!REDUCED()) d.animate([{opacity:0,transform:'translate(-50%,14px) scale(.96)'},{opacity:1,transform:'translate(-50%,0) scale(1)'}],{duration:320,easing:'cubic-bezier(.34,1.56,.64,1)'});
    setTimeout(()=>{ if(REDUCED()){d.remove();return;} d.animate([{opacity:1},{opacity:0}],{duration:220}).onfinish=()=>d.remove(); },1700);
  }
  _sag(A,B,sag,sway){const c={x:(A.x+B.x)/2+sway,y:(A.y+B.y)/2+sag};return `M${A.x} ${A.y}Q${c.x.toFixed(1)} ${c.y.toFixed(1)} ${B.x} ${B.y}`;}
  _sway(e){ if(REDUCED()) return; const t0=performance.now(); const ps=$$('path',e.g).filter(p=>p.classList.contains('yarn')||p.classList.contains('ysh'));
    const tick=now=>{const t=now-t0; const s=14*Math.exp(-t/260)*Math.sin(t/70); const d=this._sag(e.cork.A,e.cork.B,e.cork.sag+s*.5,s); ps.forEach(p=>p.setAttribute('d',d)); if(t<1100) requestAnimationFrame(tick);}; requestAnimationFrame(tick); }
  _len(d){const p=svgEl('path',{d},this.defs);const l=p.getTotalLength();p.remove();return l;}
  _pt(d,at){const p=svgEl('path',{d},this.defs);const q=p.getPointAtLength(at);p.remove();return q;}

    const cork=this.style==='cork', sky=this.style==='sky';
    const glyph=!cork&&(e.type==='love'||e.type==='rivalry');
    const tx=svgEl('text',{x:0,y:4.5,'font-family':'Newsreader,Georgia,serif','font-style':'italic','font-size':cork?12.5:13.5,style:`fill:${cork?'#2F2F2F':sky?'#F6E6CF':'var(--ink-c)'}`},pg); tx.textContent=e.label;
    const w=tx.getComputedTextLength()+(glyph?16:0)+16;
    const r=svgEl('rect',{x:-w/2,y:-11,width:w,height:22,rx:cork?1:11,style:cork?'fill:#F1E6C8;opacity:.93':sky?'fill:#1E1814;stroke:#E9C9A8;stroke-width:.8':'fill:var(--pill);stroke:var(--edge);stroke-width:.8'}); pg.insertBefore(r,tx);

    pw.setAttribute('transform',`translate(${m.x.toFixed(1)} ${m.y.toFixed(1)})${cork?' rotate('+(((hash(e.a+e.b)%9)-4))+')':''}`);
  }
  _blot(center){
    if(REDUCED()) return; const L=this._len(center); const p=this._pt(center,Math.max(0,L-this.nodeR-2));

    const t0=performance.now(); const tick=now=>{const t=Math.min(1,(now-t0)/420),k=1-Math.pow(1-t,2);
      bits.forEach(b=>{b.c.setAttribute('cx',p.x+Math.cos(b.a)*b.d*k); b.c.setAttribute('cy',p.y+Math.sin(b.a)*b.d*k); b.c.style.opacity=1-t; if(!b.d) b.c.setAttribute('r',4+6*k);});
      if(t<1) requestAnimationFrame(tick); else g.remove();}; requestAnimationFrame(tick);
  }
}
function legendSample(type,style){
  const w=64,h=14; const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox',`0 0 ${w} ${h}`); s.setAttribute('aria-hidden','true');
  const pts=[]; for(let i=0;i<=40;i++){const t=i/40;pts.push({x:4+t*56,y:7,nx:0,ny:1,t});}
  const ink=style==='sky'?'#F3DFC7':style==='cork'?YARN[type]:'var(--edge)';
  const st=(w,d)=>`stroke:${ink};stroke-width:${w};fill:none;stroke-linecap:round;${d?'stroke-dasharray:'+d:''}`;
  if(style==='cork'){ svgEl('path',{d:'M4 4Q32 14 60 4',style:`stroke:${YARN[type]};stroke-width:2.6;fill:none;${type==='secret'?'stroke-dasharray:6 4':''}`},s); if(type==='secret') s.style.background='#6b5a48'; return s; }
  if(type==='family'){svgEl('path',{d:D(pts,off(2.2)),style:st(1.4)},s);svgEl('path',{d:D(pts,off(-2.2)),style:st(1.4)},s);}
  else if(type==='rivalry') svgEl('path',{d:D(pts,(p,i)=>p.t>.3&&p.t<.7?{x:p.x,y:7+(i%2?4:-4)}:p),style:st(1.8)},s);
  else if(type==='secret') svgEl('path',{d:D(pts),style:st(2.6,'.5 6')},s);
  else svgEl('path',{d:D(pts),style:st(1.8)},s);
  if(type==='love') svgEl('path',{d:HEART,transform:'translate(27 2.5)',style:'fill:#A33F35'},s);
  if(type==='mentor') svgEl('path',{d:'M60 7L50 2.5L52.5 7L50 11.5Z',style:`fill:${ink}`},s);
  return s;
}
function mapScreen(phone,o){
  const scr=document.createElement('div'); scr.className='scr'; phone.appendChild(scr);
  scr.innerHTML=`${statusBar()}<div class="nav"><button class="ibtn" aria-label="Back">${IC.back}</button><div class="ttl">${o.title||'Character map'}</div><button class="ibtn" aria-label="Share">${IC.share}</button></div>
    <div class="map ${o.bgCls||'dotpaper'}"><div class="map-hint" aria-live="polite">${o.hint||'Tap one character, then another.'}</div></div>${o.legend?`<div class="legend"><div class="lh"><span>${o.legendTitle||'Type of link'}</span><span>${o.legendNote||''}</span></div><div class="lrow"></div></div>`:''}`;
  if(o.bgCls&&o.bgCls.includes('sky')){ scr.style.background='#120E0B'; scr.style.color='#F2E6D6'; }
  const host=$('.map',scr);
  const view=new MapView(host,{style:o.style,section:phone.closest('section'),scr,hintEl:$('.map-hint',scr),avatar:o.avatar,nodeR:o.nodeR,type:o.type});
  if(o.legend){ const row=$('.lrow',scr); (o.types||TYPE_ORDER).forEach(t=>{ const b=document.createElement('button'); b.className='lg'; b.setAttribute('aria-pressed',t===view.type); b.dataset.t=t;
      b.appendChild(legendSample(t,o.style)); b.insertAdjacentHTML('beforeend',`<span>${{family:'Family',love:'Love',rivalry:'Rivalry',ally:'Ally',mentor:'Mentor',secret:'Secret'}[t]||t}</span>`);
      b.onclick=()=>{view.type=t; $$('.lg',row).forEach(x=>x.setAttribute('aria-pressed',x===b));}; row.appendChild(b); }); }
  return {scr,view,host};
}

const POS={jane:[70,110],darcy:[300,105],eliz:[185,235],bingley:[308,322],mrb:[62,322],mrsb:[118,458],wickham:[262,462]};
const PRE=[['eliz','jane','family','Siblings'],['mrb','mrsb','love','Partners'],['mrb','eliz','family','Parent of'],['darcy','bingley','ally','Good friends']];
function heroRing(view,id){ const p=view.pos[id]; const r=40; let d=''; for(let i=0;i<=44;i++){const t=i/40*Math.PI*2-1.2; const rr=r+(i>40?3:0)+Math.sin(t*3)*1.6; d+=(i?'L':'M')+(p.x+rr*Math.cos(t)*1.08).toFixed(1)+' '+(p.y-4+rr*Math.sin(t)).toFixed(1);} svgEl('path',{d,class:'ring-hero'},view.bg); }

function buildC(kind,phone){
  const sec=phone.closest('section');
  if(kind==='C0'){
    const seeds={jane:5,darcy:3,eliz:12,bingley:9,mrb:10,mrsb:11,wickham:2};
    const {view}=mapScreen(phone,{style:'thread',avatar:(c,id)=>blob(seeds[id],60),hint:'Tap one character, then another.'});
    Object.entries(POS).forEach(([id,[x,y]])=>view.addNode(id,x,y)); PRE.forEach(([a,b,t,l])=>view.connect(a,b,t,l));
    const fab=document.createElement('div'); fab.className='fab'; fab.setAttribute('aria-hidden','true'); fab.innerHTML=IC.plus; $('.scr',phone).appendChild(fab);
    return;
  }
  if(kind==='C1'){
    const {view}=mapScreen(phone,{style:'ink',legend:true,legendNote:'Unsure ties draw in pencil',type:'rivalry',
      avatar:(c,id)=>c.role?`<span class="rolewrap">${peep(c,{size:60,live:true})}${rolePill(c)}</span>`:peep(c,{size:60,live:true})});
    view.pairCard=true;
    Object.entries(POS).forEach(([id,[x,y]])=>{ const b=view.addNode(id,x,y); const nm=$('.nm',b); nm.style.background=CAST[id].disc; nm.style.color='#2F2F2F'; nm.classList.add('tint'); });
    svgEl('circle',{cx:POS.eliz[0],cy:POS.eliz[1]-2,r:52,style:'fill:var(--edge);opacity:.08'},view.bg);
    PRE.forEach(([a,b,t,l])=>view.connect(a,b,t,l)); heroRing(view,'eliz');
    view.connect('mrsb','bingley','unknown','Hopes for him');
    sec._replay=()=>{ view.clearEdges(e=>PRE.some(([a,b])=>a===e.a&&b===e.b)||(e.a==='mrsb'&&e.b==='bingley')); if(view.sel){view.node(view.sel).classList.remove('sel');view.sel=null;}
      view.tap('eliz'); setTimeout(()=>{ const t=view.type; view.type='rivalry'; view.tap('darcy'); view.type=t; },REDUCED()?0:420); };
    sec._auto=true; return;
  }
  if(kind==='C2'){
    const {view,scr}=mapScreen(phone,{style:'cork',bgCls:'cork',legend:true,legendTitle:'Yarn colour',nodeR:8,type:'rivalry',
      avatar:(c,id)=>`<span class="polaroid">${peep(c,{size:58,live:true})}<span class="pin"></span><span class="nm">${c.name}</span></span>`});
    $('.map-hint',scr).style.cssText='background:#F1E6C8;border:0;transform:rotate(-1.5deg);box-shadow:0 3px 6px rgba(0,0,0,.25)';
    const rot={jane:-4,darcy:3,eliz:-2,bingley:5,mrb:2,mrsb:-5,wickham:4};
    Object.entries(POS).forEach(([id,[x,y]])=>view.addNode(id,x,y+6,{noName:true,rot:rot[id]})); PRE.forEach(([a,b,t,l])=>view.connect(a,b,t,l));
    sec._replay=()=>{ view.clearEdges(e=>PRE.some(([a,b])=>a===e.a&&b===e.b)); view.tap('darcy'); setTimeout(()=>{const t=view.type; view.type='rivalry'; view.tap('wickham'); view.type=t;},REDUCED()?0:420); };
    sec._auto=true; return;
  }
  if(kind==='C3'){
    const SP={jane:[82,150],eliz:[168,252],mrb:[66,340],mrsb:[150,430],darcy:[292,142],bingley:[300,300],wickham:[276,446]};
    const {view,scr,host}=mapScreen(phone,{style:'sky',bgCls:'sky',legend:true,legendNote:'Tap a line to read it',nodeR:23,type:'love',avatar:(c,id)=>peep(c,{size:46,live:true})});
    $('.map-hint',scr).style.cssText='background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#F2E6D6';
    const lg=$('.legend',scr); lg.style.cssText='background:#16110D;border-color:#2B231C;color:#EADBC8'; lg.style.setProperty('--chipbg','#1E1814'); lg.style.setProperty('--line','#3A2F25'); lg.style.setProperty('--ink-c','#F2E6D6'); lg.style.setProperty('--btn','#E9C9A8'); lg.style.setProperty('--sec','#BBA994');
    const stars=document.createElement('div'); stars.className='stars'; let sh=''; for(let i=0;i<46;i++){const h=hash('s'+i); sh+=`<i style="left:${h%370}px;top:${(h>>9)%560}px;animation-delay:-${(h>>3)%40/10}s;${(h>>5)%5===0?'width:3px;height:3px':''}"></i>`;} stars.innerHTML=sh; host.prepend(stars);
    Object.entries(SP).forEach(([id,[x,y]])=>view.addNode(id,x,y));
    svgEl('ellipse',{cx:116,cy:292,rx:104,ry:192,transform:'rotate(-8 116 292)',style:'fill:rgba(233,201,168,.05);stroke:rgba(233,201,168,.32);stroke-width:1;stroke-dasharray:3 6'},view.bg);
    const lab=svgEl('text',{x:62,y:98,'font-family':'Newsreader,Georgia,serif','font-style':'italic','font-size':15,style:'fill:#E9C9A8'},view.bg); lab.textContent='The Bennets';
    PRE.forEach(([a,b,t,l])=>view.connect(a,b,t,l));
    sec._replay=()=>{ view.clearEdges(e=>PRE.some(([a,b])=>a===e.a&&b===e.b)); view.tap('jane'); setTimeout(()=>{const t=view.type; view.type='love'; view.tap('bingley'); view.type=t;},REDUCED()?0:420); };
    sec._auto=true; return;

      detailSheet(scr,c,{rel:relName,onMap:()=>go(4,id)}); $$('.dsheet [data-x], .scrim2',scr).forEach(x=>x.addEventListener('click',()=>set(st.newId?2:0))); }
    else { const ex={}; Object.entries(st.extra).forEach(([k,v])=>ex[k]=Object.assign({},v,{id:k})); egoMap(phone,scr,ids(),center||'eliz',ex,()=>{ set(st.newId?2:0); scr.innerHTML=''; list(); }); }
  }
  sec._replay=()=>go(0);
  go(0);
}

/* ═══════════ Axis D ═══════════ */
function buildD(kind,phone){
  const sec=phone.closest('section'); const scr=document.createElement('div'); scr.className='scr'; phone.appendChild(scr);
  const firstName=['Elizabeth Bennet','Jane Bennet','Mr Darcy'], firstId=['eliz','jane','darcy'];
  let n=0;
  function shell(panel){ scr.innerHTML=bookDetail(panel); $('[data-back]',scr).onclick=()=>{}; }
  const star4=(x,y,s,c)=>`<path class="dp" d="M${x} ${y-s}C${x+s*.15} ${y-s*.15} ${x+s*.15} ${y-s*.15} ${x+s} ${y}C${x+s*.15} ${y+s*.15} ${x+s*.15} ${y+s*.15} ${x} ${y+s}C${x-s*.15} ${y+s*.15} ${x-s*.15} ${y+s*.15} ${x-s} ${y}C${x-s*.15} ${y-s*.15} ${x-s*.15} ${y-s*.15} ${x} ${y-s}Z" style="stroke:${c};stroke-width:1.6;fill:${c};fill-opacity:0" />`;
  function drawStars(root){ $$('svg.draw .dp',root).forEach((p,i)=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; if(REDUCED()){p.style.strokeDashoffset=0;p.style.fillOpacity=1;return;}
      p.style.strokeDashoffset=L; p.animate([{strokeDashoffset:L,fillOpacity:0},{strokeDashoffset:0,fillOpacity:0,offset:.75},{strokeDashoffset:0,fillOpacity:1}],{duration:700,delay:200+i*160,fill:'forwards',easing:'cubic-bezier(.22,1,.36,1)'}); }); }
  function filled(c){ return `<div style="display:flex;flex-direction:column;align-items:center;padding:22px 16px 18px;position:relative;z-index:2;text-align:center">${peep(c,{size:96,live:true,cls:'popin'})}<b style="font:400 22px var(--display);margin-top:10px">${esc(c.full)}</b><span style="font-size:13px;color:var(--sec)">First heard Ch. 3, 1:12:40</span><button class="addrow" data-again style="margin:16px 0 0">${IC.plus.replace('<svg','<svg width="20" height="20"')}Add another character</button></div>`; }
  function openTray(onSave){ const i=Math.min(n,2); addTray(scr,{title:n?'Who else have you met?':'Add your first character',name:firstName[i],base:CAST[firstId[i]],fh:'Ch. 3, 1:12:40',onSave:c=>{ n++; onSave(c); }}); }
  if(kind==='D0'){
    shell(`<div class="panel dotpaper"><div class="panel-hd"><b>Characters</b><span>0</span></div><div class="empty0"><span class="gc">${IC.people}</span><b>No characters added yet.</b><p>Add characters manually now. Transcript suggestions become available after transcription.</p><button class="pillbtn" data-cta style="min-height:44px;font-size:15px">Add character</button></div></div>`);
    $('[data-cta]',scr).onclick=()=>toast(scr,'Opens the full add form (see B0).'); return;
  }
  if(kind==='D1'){
    const c=CAST.eliz;
    const render=()=>{ shell(`<div class="panel" style="background:var(--surface)"><div class="panel-hd"><b>Characters</b><span>0</span></div>
      <svg class="draw" viewBox="0 0 338 230" style="display:block;width:100%;height:auto" aria-hidden="true">
       <path d="M30 210 Q20 150 70 140 Q130 120 160 150 L170 210Z" fill="#F2A085"/><path d="M200 214 Q190 140 250 138 Q312 136 312 214Z" fill="#E3D4B5"/><path d="M92 214 Q96 170 150 168 Q236 164 248 214Z" fill="#F8D5C8"/>
       <rect x="232" y="176" width="70" height="12" rx="2" fill="#6F3825"/><rect x="238" y="164" width="60" height="12" rx="2" fill="#9DAF8A"/><rect x="242" y="152" width="52" height="12" rx="2" fill="#D9A441"/>
       <svg x="98" y="44" width="160" height="160" viewBox="40 40 680 680" style="--sk:${c.sk};--cl:${c.cl};--hc:${c.hc}"><use href="#pp-body"/><use href="#pp-h-${c.head}"/><use href="#pp-f-calm"/></svg>
       <path d="M134 188 Q158 178 180 186 L180 214 Q158 206 134 214Z" fill="#F7F1E8" stroke="#6F3825" stroke-width="2"/><path d="M180 186 Q202 178 226 188 L226 214 Q202 206 180 214Z" fill="#F7F1E8" stroke="#6F3825" stroke-width="2"/><path d="M142 196 H170 M142 202 H168 M188 196 H216 M188 202 H214" stroke="#C9B79C" stroke-width="1.4"/>
       ${star4(70,60,11,'#D9A441')}${star4(290,52,8,'#DC6B50')}${star4(46,110,6,'#6F3825')}${star4(306,108,6,'#D9A441')}
      </svg>
      <div style="padding:4px 22px 22px;position:relative"><p class="handnote" style="margin:0 0 4px;transform:rotate(-2deg)">who have you met so far?</p>
      <svg viewBox="0 0 60 40" width="46" height="30" style="position:absolute;right:56px;top:6px" aria-hidden="true"><path d="M4 6 C30 2 46 14 40 34 M40 34 l-7 -6 M40 34 l5 -8" stroke="#6F3825" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      <p style="font-size:14px;color:var(--sec);margin:4px 0 16px">Keep track of who is who as you listen. Faces, ties and where you first heard them stay with the book.</p>
      <button class="pillbtn" data-cta style="width:100%">Add your first character</button></div></div>`);
      drawStars(scr); $('[data-cta]',scr).onclick=()=>openTray(c=>{ shell(`<div class="panel dotpaper"><div class="panel-hd"><b>Characters</b><span>1</span></div>${filled(c)}</div>`); registerLive(scr); mood($('.popin',scr)); $('[data-again]',scr).onclick=()=>openTray(()=>toast(scr,'Added.')); }); };
    sec._replay=render; render(); return;
  }
  if(kind==='D2'){
    const C0=[169,124], G=[[62,74],[276,74],[169,236]];
    const render=()=>{ n=0; shell(`<div class="panel dotpaper"><div class="panel-hd"><b>Characters</b><span class="cnt">0 characters met</span></div>
      <div class="ghosts" style="position:relative;height:290px"><svg viewBox="0 0 338 290" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
        ${G.map(([x,y],i)=>`<path class="th th${i}" d="M${C0[0]} ${C0[1]} Q${(C0[0]+x)/2+(i===2?18:0)} ${(C0[1]+y)/2-(i===2?0:16)} ${x} ${y}" style="stroke:var(--acc);stroke-width:1.5;fill:none;stroke-dasharray:3 6;opacity:.55"/>`).join('')}
        ${G.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="38" class="ghost-med"/>`).join('')}
        <rect x="${C0[0]-28}" y="${C0[1]-38}" width="56" height="76" rx="6" fill="#7a5038"/><rect x="${C0[0]-28}" y="${C0[1]-38}" width="7" height="76" rx="3" fill="#5a3826"/>
        <text x="${C0[0]+3}" y="${C0[1]+5}" text-anchor="middle" font-family="Newsreader,Georgia,serif" font-style="italic" font-size="15" fill="#F3E2C7">P&amp;P</text></svg>
        ${G.map(([x,y],i)=>`<button class="ghost-btn" data-g="${i}" style="left:${x/338*100}%;top:${y}px" aria-label="${i===0?'Add the main character':'Add a character'}"><span class="gface" style="opacity:.1;filter:grayscale(1);display:block;width:100%;height:100%">${peep(CAST[firstId[i]],{size:76})}</span><span class="gplus" ${i?'hidden':''}>${IC.plus}</span></button>`).join('')}
        <span class="gcap" style="left:${G[0][0]/338*100}%;top:${G[0][1]+46}px">Who's the main<br>character?</span></div>
      <div style="padding:0 22px 22px;text-align:center"><b style="display:block;font:400 22px/1.2 var(--display)" class="dh">Your cast starts with one name.</b><p style="font-size:14px;color:var(--sec);margin:6px 0 16px" class="dp2">Press and hold a name in the lyrics, or add one here.</p><button class="pillbtn" data-cta style="width:100%">Add a character</button></div></div>`);
      const placeCap=(cap,k)=>{ if(k===2){ cap.style.left=((G[2][0]+46)/338*100)+'%'; cap.style.top=(G[2][1]-10)+'px'; cap.style.transform='none'; } else { cap.style.left=(G[k][0]/338*100)+'%'; cap.style.top=(G[k][1]+46)+'px'; cap.style.transform='translateX(-50%)'; } };
      const nextIdx=()=>$$('.ghost-btn',scr).findIndex(b=>!b.dataset.filled);
      const mark=()=>{ const k=nextIdx(); $$('.ghost-btn',scr).forEach((b,i)=>{ const p=$('.gplus',b); if(p) p.hidden=i!==k; }); const cap=$('.gcap',scr); if(k<0){cap.hidden=true;return;} cap.hidden=false; cap.innerHTML=k===0?"Who's the main<br>character?":'Who else?'; placeCap(cap,k); };
      const fill=(gi,c)=>{ const b=$(`[data-g="${gi}"]`,scr); b.innerHTML=peep(c,{size:76,live:true}); b.setAttribute('aria-label',c.full); b.dataset.filled=1; const med=$('.med',b);
        if(!REDUCED()) med.animate([{transform:'scale(.4)',opacity:0},{transform:'scale(1.1)',opacity:1,offset:.6},{transform:'scale(1)'}],{duration:620,easing:'cubic-bezier(.34,1.56,.64,1)'});
        $$('.ghost-med',scr)[gi].style.cssText='stroke-dasharray:none;opacity:0'; registerLive(scr); setTimeout(()=>blinkOnce(med),REDUCED()?0:700);
        const th=$('.th'+gi,scr); th.style.strokeDasharray='none'; th.style.opacity=1; th.style.strokeWidth=1.8;
        const k=$$('[data-filled]',scr).length; $('.cnt',scr).textContent=`${k} ${k===1?'character':'characters'} met`;
        $('.dh',scr).textContent=k===1?`${c.name} is your first.`:`${k} characters so far.`; $('.dp2',scr).textContent=k<3?'Who else have you met?':'Open the map to see how they connect.'; $('[data-cta]',scr).textContent=k<3?'Add another':'Open map';
        mark(); haptic(sec,'Light haptic'); };
      const next=gi=>{ if(gi==null) gi=nextIdx(); if(gi<0){ toast(scr,'Opens the map.'); return; } openTray(c=>fill(gi,c)); };
      $$('.ghost-btn',scr).forEach(b=>b.onclick=()=>{ if(!b.dataset.filled) next(+b.dataset.g); });
      $('[data-cta]',scr).onclick=()=>next(null);
      if(!REDUCED()) $$('.ghost-med',scr).forEach((g,i)=>g.animate([{opacity:.45},{opacity:.9},{opacity:.45}],{duration:3200,delay:i*500,iterations:Infinity}));
    };
    sec._replay=render; render(); return;
  }
  if(kind==='D3'){
    const render=()=>{ n=0; let s=''; for(let i=0;i<40;i++){const h=hash('d'+i); s+=`<i style="left:${h%330}px;top:${(h>>8)%230}px;animation-delay:-${(h>>3)%40/10}s"></i>`;}
      shell(`<div class="panel sky" style="border-color:#2B231C;color:#F2E6D6"><div class="panel-hd"><b>Characters</b><span style="color:#BBA994">0</span></div>
      <div style="position:relative;height:250px"><div class="stars">${s}</div>
        <svg viewBox="0 0 338 250" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">${[[90,90],[170,60],[250,110],[200,180],[110,190]].map(([x,y],i)=>`<g class="bstar" data-i="${i}"><circle cx="${x}" cy="${y}" r="9" fill="rgba(246,230,207,.12)"/><circle cx="${x}" cy="${y}" r="2.6" fill="#F6E6CF"/></g>`).join('')}
        <path d="M90 90L170 60L250 110L200 180L110 190" stroke="rgba(246,230,207,.18)" stroke-width="1" fill="none" stroke-dasharray="2 5"/></svg>
        <div class="sky-slot" style="position:absolute;left:${170/338*100}%;top:60px;transform:translate(-50%,-50%)"></div></div>
      <div style="padding:0 22px 22px;text-align:center"><b style="display:block;font:italic 400 24px/1.2 var(--serif);color:#F6E6CF" class="dh">Every book is a sky.</b><p style="font-size:15px;color:#CDBBA6;margin:4px 0 16px" class="dp2">Name your first star.</p><button class="pillbtn" data-cta style="width:100%;background:#E9C9A8;color:#1E1814">Name a star</button></div></div>`);
      $('[data-cta]',scr).onclick=()=>openTray(c=>{ const slot=$('.sky-slot',scr); slot.innerHTML=`<span style="display:flex;flex-direction:column;align-items:center;gap:4px">${peep(c,{size:48,live:true})}<span style="font:italic 400 14px var(--serif);color:#EADBC8">${esc(c.name)}</span></span>`;
        $('.sky-slot .med',scr).style.boxShadow='0 0 0 1.5px rgba(246,230,207,.7),0 0 22px 6px rgba(233,201,168,.45)'; registerLive(scr);
        if(!REDUCED()) slot.firstChild.animate([{transform:'scale(.2)',opacity:0},{transform:'scale(1.12)',opacity:1,offset:.6},{transform:'scale(1)'}],{duration:640,easing:'cubic-bezier(.34,1.56,.64,1)'});
        $$('.bstar',scr)[1].style.opacity=0; $('.dh',scr).textContent=`${c.name} is your first star.`; $('.dp2',scr).textContent='Who else is in this sky?'; $('[data-cta]',scr).textContent='Name another'; haptic(sec,'Light haptic'); });
    };
    sec._replay=render; render(); return;
  }
}

/* ═══════════ autoplay demo ═══════════ */
(function demo(){
  const sec=document.getElementById('B2'), phone=$('.phone',sec), rig=$('.rig'), fit=$('.fit'), finger=$('.finger'), cap=$('.cap'), pp=$('.pp');
  const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.5.86l10.5-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></svg>';
  let scale=1, paused=false, visible=true;
  io.observe(phone); buildB2(phone);

  function layout(){
    const h=innerHeight-24-54, w=innerWidth-24;
    scale=Math.min(1,h/800,w/390);
    fit.style.width=390*scale+'px'; fit.style.height=800*scale+'px'; rig.style.transform='scale('+scale+')';
  }
  addEventListener('resize',layout); layout();

  new IntersectionObserver(es=>es.forEach(e=>{visible=e.isIntersecting;}),{threshold:.25}).observe(fit);
  function setPaused(v){ paused=v; pp.innerHTML=v?PLAY:PAUSE; pp.setAttribute('aria-label',v?'Play demo':'Pause demo'); }
  pp.onclick=()=>setPaused(!paused); setPaused(false);

  const gate=async()=>{ while(paused||!visible) await new Promise(r=>setTimeout(r,200)); };
  const wait=async ms=>{ await sleep(ms); await gate(); };
  const say=(n,t)=>{ cap.innerHTML='<b>'+n+'</b>'+t; };

  async function point(el){
    if(!el) return;
    const r=el.getBoundingClientRect(), o=rig.getBoundingClientRect();
    finger.style.left=((r.left+r.width/2-o.left)/scale)+'px'; finger.style.top=((r.top+r.height/2-o.top)/scale)+'px';
    finger.classList.add('on'); await wait(620);
  }
  async function tap(el,act){
    await point(el); finger.classList.add('tap'); await sleep(130); finger.classList.remove('tap');
    if(act) act(); else if(el) el.click(); await wait(320);
  }
  async function type(inp,text){
    inp.value=''; inp.dispatchEvent(new Event('input'));
    for(const ch of text){ inp.value+=ch; inp.dispatchEvent(new Event('input')); await wait(ch===' '?150:75); }
  }
  const scr=()=>$('.scr',phone);

  async function run(){
    finger.classList.remove('on');
    sec._go(0);
    say('1','Your cast so far, tied together in ink.');
    await wait(2200);

    say('2','Someone new? Tap + and type their name.');
    await tap($('.fab',scr()),()=>sec._go(1));
    await wait(450);
    const inp=$('#b2n',scr());
    await point(inp); finger.classList.remove('on');
    await type(inp,'Charlotte Lucas');
    await wait(500);
    await tap($('[data-next="2"]',scr()));

    say('3','A face is drawn from the name. Shuffle until it fits.');
    await wait(700);
    await tap($('.growtray .dice',scr())); await wait(500);
    await tap($('.growtray .dice',scr())); await wait(700);
    await tap($('[data-next="3"]',scr()));

    say('4','Say who they are tied to, and how.');
    await wait(600);
    await tap($('[data-rel] .tchip[data-id="eliz"]',scr()));
    await tap($('[data-type] .tchip[data-t="ally"]',scr()));
    await tap($('[data-add]',scr()));
    finger.classList.remove('on');

    say('5','They drop into the map, and the tie draws itself.');
    await wait(2600);

    const view=sec._view(), c=view.cast.charlotte;
    const scrim=document.createElement('div'); scrim.className='scrim2';
    const sh=document.createElement('div'); sh.className='tray dsheet';
    sh.innerHTML='<div class="grab"></div>'+idCard(c,{title:'Meet '+c.name,rel:'Elizabeth',size:88})+'<div class="rowbtns"><button class="pillbtn ghost">Share</button><button class="pillbtn">Add another</button></div>';
    scr().appendChild(scrim); scr().appendChild(sh); registerLive(sh);
    if(!REDUCED()) sh.animate([{transform:'translateY(100%)'},{transform:'none'}],{duration:320,easing:'cubic-bezier(.22,1,.36,1)'});
    say('6','A card for each, with when you first heard them.');
    await wait(3400);
    if(!REDUCED()) await sh.animate([{transform:'none'},{transform:'translateY(100%)'}],{duration:240,easing:'ease-in'}).finished;
    sh.remove(); scrim.remove();

    say('7','Later, tap two characters to tie them.');
    view.onTap=null; view.type='rivalry';
    await tap(view.node('darcy'),()=>view.tap('darcy'));
    await wait(500);
    await tap(view.node('eliz'),()=>view.tap('eliz'));
    finger.classList.remove('on');
    await wait(3600);
  }

  (async()=>{
    if(REDUCED()){ await run(); return; } // one pass to the finished map, no loop
    for(;;) await run();
  })();
})();
</script>
